/* Διαθέσιμοι κατά προτεραιότητα (μήνες από την τελευταία ολοκλήρωση):
   g1 πράσινο (<8) · g2 κιτρινοπράσινο (8–12) · g3 κόκκινο (12+) · μπλε = δικός σου · γκρι = μη διαθέσιμος */
:root{ --g1:#6CCB9C; --g2:#DAE36C; --g3:#F07464; --g1t:#7BD6A9; --g2t:#DDE572; --g3t:#F58474; --late:#F07464;
  --ok:#6FD3C0; --ok-soft:rgba(111,211,192,.12); --mine:#4A82D6; --mine-soft:rgba(74,130,214,.14); }
:root[data-theme="light"]{ --g1:#5DB889; --g2:#BFCC3A; --g3:#E25A48; --g1t:#16774A; --g2t:#687500; --g3t:#B9351F; --late:#C8412F;
  --ok:#127966; --ok-soft:rgba(18,121,102,.09); --mine:#25508F; --mine-soft:rgba(37,80,143,.10); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ground);color:var(--text);
  font:15px/1.5 'Geologica',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  box-shadow:0 0 0 1px var(--rule-soft)}

/* ---- Κεφαλίδα: τίτλος + ποιος είναι συνδεδεμένος ---- */
header{flex:0 0 auto;padding:calc(14px + var(--safe-t)) 10px 10px 14px;border-bottom:1px solid var(--rule-soft)}
header .ico{--icobg:var(--ground)}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htop .sub{color:var(--faint);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:0;flex:0 0 auto}
.hbtns button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--text);border-radius:9px}
.hbtns button:active{background:var(--raised)}
.hbtns .ico{width:19px;height:19px}
.hlink{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text);border-radius:9px}
.boardlink{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule-soft);color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
.boardlink .ico{width:19px;height:19px}
.hbtns .spin-on svg{animation:sp .8s linear infinite}
.whob{display:flex;align-items:center;gap:11px;width:100%;margin-top:9px;padding:8px 10px;text-align:left;
  background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px}
.whob[hidden]{display:none}
.whob .av{width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent-wash);border:1px solid var(--accent-dim);color:var(--accent);font-size:13px;font-weight:700}
.whob .wn{flex:1;min-width:0}
.whob .wn small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.whob .wn b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whob .wc{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--accent);padding:6px 10px;
  border:1px solid var(--accent-dim);border-radius:99px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 26px}
/* μικρή ένδειξη έκδοσης στο τέλος κάθε σελίδας */
main::after{content:attr(data-ver);display:block;text-align:center;font-size:10px;letter-spacing:.06em;
  color:var(--faint);opacity:.75;padding:22px 0 2px;grid-column:1/-1}
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--rule-soft);background:var(--sheet);
  padding-bottom:var(--safe-b)}
nav button{flex:1;padding:9px 4px 12px;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint)}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
nav button i{font-style:normal;display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:99px;
  background:var(--mine);color:#fff;font-size:9.5px;line-height:16px;letter-spacing:0;vertical-align:1px}

/* τίτλοι ενοτήτων όπως στην εφαρμογή διαχείρισης */
h2.sec,.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin:22px 2px 8px;font-weight:700}
p.lead{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.5}

.card{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;
  overflow:hidden;margin-bottom:12px}
.card .mini{height:132px;background:var(--map-bg)}
.card .mini svg{display:block;width:100%;height:100%}
.card .mmap{height:220px;background:var(--map-bg)}
.card .body{display:block;width:100%;text-align:left;padding:12px 14px 4px}
.card .nm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card .sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.card .acts{display:flex;gap:8px;padding:10px 12px 12px}
.card .acts .btn{flex:1}

/* ετικέτες κατάστασης (pill) */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:5px 10px;border-radius:99px;margin-top:8px;border:1px solid transparent}
.tag i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tag.free{background:var(--ok-soft);color:var(--ok)} .tag.free i{background:var(--ok)}
.tag.mine{background:var(--mine-soft);color:var(--mine);border-color:var(--mine-soft)} .tag.mine i{background:var(--mine)}
.tag.busy{background:var(--raised);color:var(--muted);border-color:var(--rule)} .tag.busy i{background:var(--idle)}
.tag.late{background:rgba(240,116,100,.14);color:var(--late);border-color:rgba(240,116,100,.45)} .tag.late i{background:var(--late)}

/* κουμπιά */
.big{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;text-align:center;padding:14px 12px;border-radius:10px;
  font-size:15px;font-weight:600;margin-top:10px;background:var(--raised);
  border:1px solid var(--rule);color:var(--text)}
.big.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.big.alt{background:var(--sheet)}
.big:active,.btn:active{opacity:.75}
.big[disabled]{opacity:.45}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;padding:11px 8px;white-space:nowrap;
  border-radius:10px;font-size:13.5px;font-weight:600;background:var(--raised);border:1px solid var(--rule)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.big .ico{width:20px;height:20px}
.btn .ico{width:18px;height:18px}
.big.go .ico .d,.big.go .ico .d1,.btn.pri .ico .d,.btn.pri .ico .d1{fill:currentColor;fill-opacity:.18}
.big.go .ico .bg,.btn.pri .ico .bg{fill:var(--accent)}
.big.alt .ico,.card .ico{--icobg:var(--sheet)}
.big:not(.alt):not(.go) .ico{--icobg:var(--raised)}
.btn:not(.pri) .ico{--icobg:var(--raised)}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--rule-soft);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.kv b{font-weight:600;text-align:right}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:8px}
.note{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;
  padding:11px 13px;font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.note b{color:var(--text)}
.note.late{background:rgba(240,116,100,.10);border-color:rgba(240,116,100,.45);color:var(--text)}
.note.late b{color:var(--late)}
.note.due{background:rgba(218,227,108,.12);border-color:rgba(190,200,60,.5);color:var(--text)}

/* ---- Επιλογή ονόματος ---- */
.steps{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;padding:6px 12px;margin-bottom:12px}
.st{display:flex;gap:11px;align-items:flex-start;padding:8px 0;font-size:14px;line-height:1.45}
.st+.st{border-top:1px solid var(--rule-soft)}
.st i{font-style:normal;flex:0 0 auto;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-wash);border:1px solid var(--accent-dim);color:var(--accent);font-size:12.5px;font-weight:700}
.search{display:flex;align-items:center;gap:9px;background:var(--sheet);border:2px solid var(--accent-dim);
  border-radius:11px;padding:0 12px}
.search .ico{width:18px;height:18px;color:var(--text)}
.search input{flex:1;background:none;border:0;padding:13px 0;color:var(--text);font:inherit;font-size:16px;min-width:0;outline:0}
.search input::placeholder{color:var(--faint)}
.nlist{margin-top:10px;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;overflow:hidden}
.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--rule-soft);font-size:15px;font-weight:500}
.pick:last-child{border-bottom:0}
.pick .av{width:32px;height:32px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--raised);border:1px solid var(--rule);color:var(--muted);font-size:12px;font-weight:700}
.pick:active{background:var(--raised)}
.addp{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-top:10px;padding:10px 12px;
  background:var(--sheet);border:1px dashed var(--accent-dim);border-radius:12px}
.addp .av{width:32px;height:32px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--sheet);border:1px solid var(--rule);color:var(--text)}
.addp .av .ico{width:20px;height:20px}
.addp b{display:block;font-size:14.5px;font-weight:600;color:var(--accent)}
.addp small{display:block;font-size:11.5px;color:var(--faint)}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin:14px 8px 0}
input,select{width:100%;background:var(--raised);border:1px solid var(--rule);border-radius:10px;
  padding:12px;color:var(--text);font:inherit;font-size:16px;min-width:0}

/* ---- Χάρτες ---- */
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--rule-soft);
  margin-bottom:14px;background:var(--map-bg)}
.mapbox .lf{height:260px}
.leaflet-tile-pane{filter:var(--tilefx)}
.leaflet-container{background:var(--map-bg);font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(128,128,128,.16)!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:9px!important;overflow:hidden;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5)!important}
.leaflet-control-zoom a{background:var(--sheet)!important;color:var(--text)!important;border-color:var(--rule)!important}
.leaflet-control-zoom-in{border-bottom:1px solid var(--rule)!important}
.maplbl{background:var(--sheet);border:1px solid var(--rule);color:var(--text);border-radius:7px;
  box-shadow:none;font-weight:600;font-size:12px;padding:3px 8px}
.maplbl::before{display:none}
.mmw{position:relative;overflow:hidden;background:var(--map-bg)}
.mmt{position:absolute;inset:0;filter:var(--tilefx)}
.mmt img{position:absolute;width:256px;height:256px;max-width:none}
.mmw svg{position:absolute;inset:0;width:100%;height:100%}

/* κουμπί επιστροφής: καθαρό, με τη θέση όπου γυρίζει */

/* φύλλο ενεργειών */
.scrim{position:fixed;inset:0;background:rgba(8,11,14,.62);display:flex;align-items:flex-end;z-index:1100}
.sheet{background:var(--sheet);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;width:100%;max-width:560px;margin:0 auto;
  padding:10px 16px calc(18px + var(--safe-b));max-height:88vh;max-height:88svh;overflow-y:auto}
.grab{display:block;width:36px;height:4px;border-radius:99px;background:var(--rule);margin:2px auto 14px;touch-action:none}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:700}
.sheet input{margin-bottom:4px}
.sheet .sh-sub{margin:0 0 12px;color:var(--faint);font-size:12.5px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + var(--safe-b));background:var(--raised);
  border:1px solid var(--accent-dim);border-radius:11px;padding:12px 14px;display:none;z-index:1200;
  font-size:13.5px;max-width:528px;margin:0 auto;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
#toast.on{display:block}
.spin{width:20px;height:20px;border:2px solid var(--rule);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.proc{text-align:center;padding:26px 0 18px}
.proc .spin{width:34px;height:34px;border-width:3px;margin-bottom:14px}
.okic{width:46px;height:46px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;
  background:var(--ok-soft);color:var(--ok);font-size:24px;font-weight:800}

/* ---- Οι τομείς μου (πάνω στη σελίδα διαθέσιμων) ---- */
.mybox{background:var(--sheet);border:1px solid var(--mine-soft);border-left:3px solid var(--mine);
  border-radius:12px;padding:4px 12px 6px;margin-bottom:14px}
.mb-h{display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px}
.mb-h span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mine);font-weight:700}
.mb-h .lnk{font-size:12.5px}
.mrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 0}
.mrow+.mrow{border-top:1px solid var(--rule-soft)}
.mnum{flex:0 0 auto;min-width:40px;height:36px;padding:0 6px;border-radius:10px;display:grid;place-items:center;
  border:2px solid var(--mine);color:var(--mine);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.minfo{flex:1;min-width:0;display:block}
.minfo b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.mval{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.mval b{display:block;font-size:16px;font-weight:700;line-height:1.1}
.mval em{display:block;font-style:normal;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.mrow.late .mnum{border-color:var(--late);color:var(--late)}
.mrow.late .mval b,.mrow.late .mval em{color:var(--late)}
.mpend{font-size:12.5px;color:var(--muted);padding:8px 0 4px;border-top:1px solid var(--rule-soft)}

/* ---- Υπόμνημα: διαθέσιμοι τομείς και προτεραιότητα ---- */
.age-legend{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;
  padding:12px 12px 11px;margin:0 0 14px}
.al-top{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 2px 6px}
.al-txt{margin:0 2px 10px;font-size:13px;line-height:1.5;color:var(--muted)}
.al-txt b{color:var(--text);font-weight:600}
.al-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lv{border-radius:10px;border:2px solid var(--c);background:var(--sheet);padding:7px 4px 6px;text-align:center;line-height:1.2}
.lv b{display:block;font-size:13.5px;font-weight:800;color:var(--ct)}
.lv span{display:block;font-size:11.5px;font-weight:600;color:var(--text);margin-top:1px}
.lv em{display:block;font-style:normal;font-size:10px;color:var(--faint);margin-top:2px}
.lv.on{background:var(--c);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}
.lv.on b,.lv.on span,.lv.on em{color:#122019}
.al-clear{display:block;margin:10px auto 0;font-size:12.5px;font-weight:600;color:var(--accent);
  padding:6px 12px;border:1px solid var(--accent-dim);border-radius:99px}
.al-more{display:flex;flex-direction:column;gap:6px;margin:11px 2px 0;padding-top:10px;border-top:1px solid var(--rule-soft);
  font-size:12.5px;color:var(--muted)}
.al-more span{display:flex;align-items:center;gap:8px}
.al-dot{width:14px;height:14px;border-radius:4px;display:inline-block;flex:0 0 auto;border:2px solid}
.al-dot.busy{border-color:var(--idle);background:var(--raised)} .al-dot.mine{border-color:var(--mine);background:var(--mine-soft)}

/* ---- Τομείς ανά περιοχή ---- */
.town-sec{margin-bottom:12px;border:1px solid var(--rule-soft);border-radius:12px;overflow:hidden;background:var(--sheet)}
.town-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px}
.town-nm{font-size:14px;font-weight:700;letter-spacing:-.01em}
.town-ct{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:99px;
  color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-soft);white-space:nowrap}
.town-ct.none{color:var(--faint);background:var(--raised);border-color:var(--rule)}
.town-map{height:240px;background:var(--map-bg);position:relative;overflow:hidden;
  border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.town-map .mmw,.town-map>svg{width:100%!important;height:100%!important;display:block}
.fl-cap{padding:10px 12px 0;font-size:12.5px;color:var(--muted)}
.fl-cap b{color:var(--text);font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:7px;padding:8px 12px 12px}
.fchip{min-width:58px;padding:5px 7px 4px;border-radius:10px;border:2px solid;background:var(--sheet);
  text-align:center;cursor:pointer;line-height:1.15}
.fchip:active{opacity:.7}
.fchip b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fchip small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap;margin-top:1px}
.town-none{padding:10px 12px 12px;font-size:12.5px;color:var(--faint)}
/* αριθμοί στον χάρτη */
.leaflet-tooltip.numlbl{background:transparent;border:0;box-shadow:none;padding:0;margin:0}
.leaflet-tooltip.numlbl::before{display:none}
.nb{display:inline-block;min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:2.5px solid;
  font:800 13px/21px 'Geologica',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
  background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.nb.mine{border-color:var(--mine);color:var(--mine)}
.nb.idle{min-width:20px;height:20px;line-height:18px;font-size:10.5px;font-weight:700;padding:0 5px;border-width:1px;
  border-color:var(--rule);color:var(--muted);box-shadow:none}

/* Σύνδεσμος */
.lnk{color:var(--accent);font-weight:600;background:none;border:0;cursor:pointer;font:inherit;padding:0}
/* ---- εικονίδια δύο χρωμάτων ---- */
.ico{width:20px;height:20px;display:block;flex:0 0 auto;--icobg:var(--sheet)}
.ico .d{fill:var(--duo);fill-opacity:var(--duo-op)}
.ico .d1{fill:var(--duo)}
.ico .bg{fill:var(--icobg)}
.ico .ns{stroke:none}
.ico .mb{fill:var(--icobg)}
.ico .mp{fill:none}
/* ---- λογότυπο ---- */
.logo{width:30px;height:30px;border-radius:7px;box-shadow:0 0 0 1px var(--rule-soft);flex:0 0 auto;display:block}
.logo .lt{fill:var(--logo-tile)}
.logo .li{fill:none;stroke:var(--logo-ink)}
.logo .la{fill:var(--logo-acc);stroke:var(--logo-acc)}
.logo .lq{fill:var(--logo-acc);fill-opacity:.3;stroke:var(--logo-ink)}
.logo .lb{fill:var(--logo-acc);stroke:var(--logo-tile)}
.logo .lh{fill:var(--logo-tile)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand .bt{min-width:0}
.brand .app{font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
/* ---- κάτω καρτέλες με εικονίδια ---- */
nav button{display:flex;flex-direction:column;align-items:center;gap:4px}
nav .ico{width:22px;height:22px;--icobg:var(--sheet)}
nav button:not(.on) .ico .d,nav button:not(.on) .ico .d1{fill:none}
nav button.on .ico{color:var(--text)}
nav button.on .ico .mb{fill:var(--duo);stroke:var(--sheet);stroke-width:1.6}
nav button.on .ico .mp{fill:var(--sheet);stroke:none}
/* ---- κουμπί «πίσω» ---- */
.back{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;margin:0 0 12px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:99px;color:var(--text);
  font-size:13px;font-weight:600;line-height:1.2}
.back .ico{width:22px;height:22px}
.back:active{background:var(--raised)}
/* ===== Υπολογιστής / tablet: πλαϊνή πλοήγηση, περισσότερος χώρος ===== */
@media (min-width:900px){
  #app{max-width:1280px;display:grid;grid-template-columns:220px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);grid-template-areas:"h h" "n m";box-shadow:none}
  #app.nonav{grid-template-columns:minmax(0,1fr);grid-template-areas:"h" "m"}
  header{grid-area:h;padding:16px 24px 12px}
  nav{grid-area:n;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;
    border-top:0;border-right:1px solid var(--rule-soft);background:transparent}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;
    padding:11px 14px;border-radius:10px;font-size:11.5px;text-align:left}
  nav button.on{box-shadow:none;background:var(--accent-wash)}
  nav button:not(.on):hover{background:var(--raised);color:var(--text)}
  main{grid-area:m;padding:22px 32px 48px}
  /* λίστες σε δύο στήλες */
  /* grid-auto-rows:max-content: κάθε σειρά παίρνει το πλήρες ύψος του περιεχομένου της —
     αλλιώς, σε σελίδα με κύλιση, οι κάρτες με πολλούς τομείς συμπιέζονται και επικαλύπτονται */
  main.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;
    column-gap:14px;align-content:start;align-items:start}
  main.cols>*{grid-column:1/-1}
  /* σελίδα ενός τομέα: κεντρική στήλη */
  main.narrow{padding-left:max(32px,calc((100% - 820px)/2));padding-right:max(32px,calc((100% - 820px)/2))}
  .mapbox .lf{height:360px}

function drawLeaflet(elId,list,opts){

  if(lmaps[elId]){ try{ lmaps[elId].remove(); }catch(e){} }

  var m=L.map(el,mo);
  lmaps[elId]=m; osm(m);
  var b=null, fb=null, focus=opts.focus;
  list.forEach(function(t){
    var g=geoOf(t.id); if(!g||!g.polygons) return;
    var main = !focus || t.id===focus;
    if(opts.town && !focus && band && t.s.state==='ready' && !t.s.mine && bandOf(t.s.rested)!==band) main=false;
    var c = main?col(t.s):'var(--idle)';

      });

    });

  });

  if(fb) m.fitBounds(fb.pad(.5),{padding:[8,8]});

function cacheGet(){ try{ return JSON.parse(localStorage.getItem('tomeis_pub')||'null'); }catch(e){ return null; } }

var lastFresh=0;

function refresh(then){
  if(Date.now()-lastFresh<5000){ if(then) then({}); return Promise.resolve(); }
  /* Το .catch πιάνει ΜΟΝΟ το δίκτυο — αλλιώς ένα λάθος στην οθόνη θα
     εμφανιζόταν σαν πρόβλημα σύνδεσης και θα κρυβόταν η επιβεβαίωση. */

    .then(function(j){

    .then(function(j){ if(!j.ok) throw new Error(j.error||'σφάλμα');

function initials(n){ var p=String(n||'').replace(/[.]/g,' ').trim().split(/\s+/);
  return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function fold(x){ return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function viewPickName(){

    names.map(function(n){ return '<button class="pick" data-n="'+esc(n)+'" onclick="setMe(this.getAttribute(\'data-n\'))">'+

}
function filterNames(){
  var v=fold($('#nq').value), n=0;
  document.querySelectorAll('#nlist .pick').forEach(function(b){
    var ok=fold(b.getAttribute('data-n')).indexOf(v)>=0; b.style.display=ok?'':'none'; if(ok) n++; });

/* νέο άτομο: γράφεται στην καρτέλα People και επιλέγεται αμέσως */
function tidyName(v){ return String(v||'').replace(/\s+/g,' ').trim().split(' ').map(function(w){
  return w ? w.charAt(0).toLocaleUpperCase('el')+w.slice(1) : w; }).join(' '); }
function addPerson(){
  var typed=tidyName(($('#nq')||{}).value||'');

    '<input id="npN" placeholder="π.χ. Παπαδόπουλος Γιώργος" autocomplete="off" value="'+esc(typed)+'">'+
    '<button class="big go" id="yes">Προσθήκη</button><button class="big" id="no">Άκυρο</button>');

/* ---------- διαθέσιμοι τομείς: ανά περιοχή ---------- */
function towns(){
  var order=[], map={};
  all().slice().sort(function(a,b){ return String(a.id).localeCompare(String(b.id),'el',{numeric:true}); })
    .forEach(function(t){ if(!map[t.town]){ map[t.town]=[]; order.push(t.town); } map[t.town].push(t); });
  var w=function(t){ return t.s.rested===Infinity?1e9:t.s.rested; };
  return order.map(function(n,i){
    var free=map[n].filter(function(t){ return t.s.state==='ready'; })
      .sort(function(a,b){ return w(b)-w(a); });
    return {name:n, list:map[n], free:free, i:i, need:free.length?w(free[0]):-1,
      old:free.filter(function(t){ return t.s.rested>=12; }).length}; })
    /* πρώτα οι περιοχές με τους πιο παλιούς διαθέσιμους τομείς */
    .sort(function(a,b){ return (b.need-a.need)||(b.old-a.old)||(b.free.length-a.free.length)||(a.i-b.i); });
}
/* ειδοποίηση για δικούς μου τομείς που έληξαν ή λήγουν σύντομα */
function lateNotes(mine){
  return mine.map(function(t){ var s=t.s;
    if(s.daysLeft<0) return '<div class="note late"><b>Εκπρόθεσμος: '+esc(numOf(t))+' · '+esc(shortName(t))+'</b><br>'+
      'Η επιστροφή ήταν έως '+fmt(s.dueOn)+' — καθυστέρηση '+durTxt(s.daysLeft)+'. '+
      '<button class="lnk" onclick="open_(\''+t.id+'\')">Δήλωση ολοκλήρωσης ή ανανέωση ›</button></div>';
    if(s.state==='due') return '<div class="note due"><b>Λήγει σύντομα: '+esc(numOf(t))+' · '+esc(shortName(t))+'</b><br>'+
      'Επιστροφή έως '+fmt(s.dueOn)+' — απομένουν '+durTxt(s.daysLeft)+'. '+
      '<button class="lnk" onclick="open_(\''+t.id+'\')">Προβολή ›</button></div>';
    return ''; }).join('');
}
var band=0;   /* φίλτρο προτεραιότητας από το υπόμνημα: 0 = όλοι */

function prioName(m){ return {3:'Υψηλή',2:'Μεσαία',1:'Κανονική'}[bandOf(m)]+' προτεραιότητα'; }
function monthsAgo(m){ return m===Infinity?'δεν έχει ολοκληρωθεί ποτέ':Math.floor(m)+' μήνες'; }

/* ύψος χάρτη: περισσότεροι τομείς → μεγαλύτερος χάρτης */
function townH(x){
  var h=Math.min(400,200+x.list.length*12);
  if(/πολ[υύ]γυρ/i.test(x.name)) h=Math.max(h,440);
  return h;
}
function lazyTownMaps(tw){
  var els=document.querySelectorAll('.town-map[data-town]');
  /* κανονικός χάρτης Leaflet: ζουμ με δύο δάχτυλα ή +/−, πάτημα σε τομέα → προβολή */
  var fill=function(el){ var x=tw[+el.getAttribute('data-town')]; if(!x) return;
    if(!x.list.some(function(t){ var g=geoOf(t.id); return g&&g.polygons&&g.polygons.length; })) return;
    el.innerHTML='';
    drawLeaflet(el.id, x.list, {town:true, onPick:open_}); };
  if(!('IntersectionObserver' in window)){ els.forEach(fill); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
    if(!e.isIntersecting) return; fill(e.target); io.unobserve(e.target); }); },{rootMargin:'300px 0px'});
  els.forEach(function(el){ io.observe(el); });
}
function lazyMineMaps(){
  var els=document.querySelectorAll('.mmap[data-id]');
  var fill=function(el){ var t=byId(el.getAttribute('data-id')); if(!t) return;
    var g=geoOf(t.id); if(!(g&&g.polygons&&g.polygons.length)){ el.innerHTML='<div class="empty" style="padding:80px 0">Φόρτωση χάρτη…</div>'; return; }
    el.innerHTML=''; drawLeaflet(el.id, inTown(t.town), {focus:t.id, fit:'focus', town:true}); };
  if(!('IntersectionObserver' in window)){ els.forEach(fill); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
    if(!e.isIntersecting) return; fill(e.target); io.unobserve(e.target); }); },{rootMargin:'300px 0px'});
  els.forEach(function(el){ io.observe(el); });
}
function lazyTiles(list){
  var els=document.querySelectorAll('.mini[data-mm]');
  var fill=function(el){ var t=byId(el.getAttribute('data-id')); if(!t) return;
    el.innerHTML=miniTiles(inTown(t.town), el.clientWidth||320, el.clientHeight||132, t.id, true); };
  if(!('IntersectionObserver' in window)){ els.forEach(fill); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
    if(!e.isIntersecting) return; fill(e.target); io.unobserve(e.target); }); },{rootMargin:'300px 0px'});
  els.forEach(function(el){ io.observe(el); });
}

}
function sheetSet(d,html){ var sh=d.querySelector('.sheet'); if(sh) sh.innerHTML='<span class="grab"></span>'+html; }
function procHtml(msg){ return '<div class="proc"><span class="spin"></span><h3>'+msg+'</h3>'+
  '<div class="sh-sub">Παρακαλώ περιμένετε — μην κλείσετε τη σελίδα.</div></div>'; }
function askFor(id){
  var t=byId(id);
  if(!t||t.s.state!=='ready'){ toast('Ο τομέας δεν είναι διαθέσιμος'); return; }
  var d=sheet('<h3>Αίτηση ανάθεσης</h3>'+
    '<div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+' — '+esc(t.town)+'</div>'+
    '<div class="kv"><span>Επιστροφή έως</span><b>'+fmt(addM(new Date(),D.settings.hold_months))+'</b></div>'+
    '<button class="big go" id="yes">Επιβεβαίωση</button>'+
    '<button class="big" id="no">Άκυρο</button>');
  d.querySelector('#no').onclick=function(){ d.remove(); };
  d.querySelector('#yes').onclick=function(){
    d.onclick=null;                                   /* δεν κλείνει όσο γίνεται η επεξεργασία */
    sheetSet(d,procHtml('Η αίτηση επεξεργάζεται…'));
    post({action:'request',person:me,territory:id},function(j){
      refresh(function(){
        detail=id; tab='mine'; render();
        var t2=byId(id)||t;
        if(j.assigned){
          sheetSet(d,'<div class="okic">✓</div><h3 style="text-align:center">Ανατέθηκε σε εσένα</h3>'+
            '<div class="sh-sub" style="text-align:center">'+esc(numOf(t2))+' · '+esc(shortName(t2))+' — '+esc(t2.town)+'</div>'+
            '<div class="kv"><span>Ανάθεση</span><b>'+fmt(new Date())+'</b></div>'+
            '<div class="kv"><span>Επιστροφή έως</span><b>'+fmt(addM(new Date(),D.settings.hold_months))+'</b></div>'+
            '<button class="big go" id="rPdf">'+ICON_DL+'Κάρτα PDF</button>'+
            '<button class="big alt" id="rMaps">'+ICON_MAP+'Google Maps</button>'+
            '<button class="big" id="rX">Κλείσιμο</button>');
          d.querySelector('#rPdf').onclick=function(){ makeCard(byId(id)||t2,'download'); };
          d.querySelector('#rMaps').onclick=function(){ openMaps(id); };
          d.querySelector('#rX').onclick=function(){ d.remove(); };
        } else {
          sheetSet(d,'<h3>Δεν ανατέθηκε</h3><div class="sh-sub">'+esc(numOf(t2))+' · '+esc(shortName(t2))+
            ' — ανατέθηκε σε άλλον λίγο πριν. Ο υπεύθυνος ενημερώθηκε.</div>'+
            '<button class="big go" id="rX">OK</button>');
          d.querySelector('#rX').onclick=function(){ d.remove(); detail=null; tab='free'; render(); };
        }
        d.onclick=function(e){ if(e.target===d) d.remove(); };
      });
    },function(){ d.remove(); });
  };
}
/* ανανέωση: ο ίδιος ζητάει να κρατήσει τον τομέα του για άλλη μία περίοδο.
   Καταγράφεται ως αίτηση· την εγκρίνει ο υπεύθυνος από την εφαρμογή του. */
function askRenew(id){
  var t=byId(id); if(!t||!t.s.mine) return;
  var d=sheet('<h3>Αίτηση ανανέωσης</h3>'+
    '<div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+' — '+esc(t.town)+'</div>'+
    '<div class="kv"><span>Τρέχουσα επιστροφή έως</span><b>'+fmt(t.s.dueOn)+'</b></div>'+
    '<div class="kv"><span>Νέα επιστροφή έως (αν εγκριθεί)</span><b>'+fmt(addM(new Date(),D.settings.hold_months))+'</b></div>'+
    '<button class="big go" id="yes">Αποστολή αίτησης</button>'+
    '<button class="big" id="no">Άκυρο</button>');
  d.querySelector('#no').onclick=function(){ d.remove(); };
  d.querySelector('#yes').onclick=function(){
    d.onclick=null; sheetSet(d,procHtml('Η αίτηση αποστέλλεται…'));
    post({action:'request',person:me,territory:id},function(){
      refresh(function(){
        sheetSet(d,'<div class="okic">✓</div><h3 style="text-align:center">Η αίτηση στάλθηκε</h3>'+
          '<div class="sh-sub" style="text-align:center">Ο υπεύθυνος θα εγκρίνει την ανανέωση.</div>'+
          '<button class="big go" id="rX">OK</button>');
        d.querySelector('#rX').onclick=function(){ d.remove(); };
        d.onclick=function(e){ if(e.target===d) d.remove(); };
      });
    },function(){ d.remove(); });
  };
}
function cancelReq(rowId){
  if(!confirm('Να ακυρωθεί το αίτημα;')) return;
  post({action:'cancelReq',rowId:rowId},function(){ refresh(function(){ toast('Η αίτηση ακυρώθηκε'); }); });
}
function declareDone(id){
  var t=byId(id);
  var d=sheet('<h3>Δήλωση ολοκλήρωσης</h3>'+
    '<div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+' — '+esc(t.town)+'</div>'+
    '<div class="kv"><span>Ημερομηνία επιστροφής</span><b>'+fmt(new Date())+'</b></div>'+
    '<button class="big go" id="yes">Επιβεβαίωση</button>'+
    '<button class="big" id="no">Άκυρο</button>');
  d.querySelector('#no').onclick=function(){ d.remove(); };
  d.querySelector('#yes').onclick=function(){ d.remove(); toast('Αποστολή…');
    post({action:'declareReturn',territory:id,date:today()},function(){
      refresh(function(){ detail=null; tab='free'; render(); toast('Καταχωρήθηκε'); }); }); };
}

applyTheme();
$('#who').onclick=function(){ if(me) changeMe(); };
load();
</script>
</body>
