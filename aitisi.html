<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Τομείς — Αίτηση</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ground:#151A20; --sheet:#1D242C; --raised:#262F39;
  --rule:#313C48; --rule-soft:#252E37;
  --text:#E4EBF2; --muted:#93A3B3; --faint:#6B7A88;
  --accent:#6FD3C0; --accent-ink:#0F1A18; --accent-dim:#3E8C7E; --accent-wash:rgba(111,211,192,.10);
  --amber:#EBB37A; --coral:#E88C76; --blue:#7FA6E8; --slate:#5A6875;
  --n1:#27544E; --n2:#336F66; --n3:#43907F; --n4:#5FBCA8; --n5:#9DECDA;
  --idle:#7E8D9B;
  --map-bg:#10151A;
  --tilefx:grayscale(1) invert(1) brightness(.62) contrast(.62);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --ground:#F2F5F4; --sheet:#FFFFFF; --raised:#EAEFEE;
  --rule:#D2D9D7; --rule-soft:#E5EAE9;
  --text:#151C22; --muted:#57646F; --faint:#84919D;
  --accent:#127966; --accent-ink:#FFFFFF; --accent-dim:#9BD3C7; --accent-wash:rgba(18,121,102,.08);
  --amber:#A96A21; --coral:#BC4C33; --blue:#3665BE; --slate:#8A97A2;
  --n1:#D3E9E3; --n2:#A4D6C8; --n3:#69B8A3; --n4:#2F8B76; --n5:#0B5B4D;
  --idle:#9BA7AE;
  --map-bg:#F6F7F7;
  --tilefx:grayscale(1) brightness(1.16) contrast(.62);
}

/* Ελεύθεροι: συνεχής κλίμακα πράσινο→κίτρινο→κόκκινο (ageCol) · μπλε = δικός σου · γκρι = σε χρήση */
:root{
  --ok:#2FA37F; --ok-soft:rgba(47,163,127,.14); --mine:#4A82D6; --mine-soft:rgba(74,130,214,.14); }
:root[data-theme="light"]{
  --ok:#127A5C; --ok-soft:rgba(18,122,92,.10); --mine:#25508F; --mine-soft:rgba(37,80,143,.10); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--text);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  box-shadow:0 0 0 1px var(--rule-soft)}
header{flex:0 0 auto;padding:calc(14px + var(--safe-t)) 18px 12px;border-bottom:1px solid var(--rule-soft);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--sheet)}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
header .who{margin-top:2px;font-size:14px;color:var(--muted)}
header .who b{color:var(--accent);font-weight:600}
.hbtns{display:flex;gap:2px;flex:0 0 auto}
.hbtns button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border-radius:10px}
.hbtns button:active{background:var(--raised)}
.hbtns svg{width:21px;height:21px;display:block}
.hbtns .spin-on svg{animation:sp .8s linear infinite}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px}
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--rule);background:var(--sheet);
  padding-bottom:var(--safe-b)}
nav button{flex:1;padding:15px 4px 17px;font-size:15px;font-weight:600;color:var(--faint);
  border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--accent);border-top-color:var(--accent)}

h2.sec{font-size:15px;font-weight:700;margin:4px 0 14px;letter-spacing:.01em}
p.lead{margin:0 0 18px;font-size:16px;color:var(--muted);line-height:1.5}

.card{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:16px;
  overflow:hidden;margin-bottom:14px}
.card .mini{height:132px;background:var(--map-bg)}
.card .mini svg{display:block;width:100%;height:100%}
.card .body{padding:14px 16px 16px}
.card .nm{font-size:19px;font-weight:700;letter-spacing:-.01em}
.card .sub{font-size:15px;color:var(--muted);margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;
  padding:6px 12px;border-radius:99px;margin-top:10px}
.tag i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.tag.free{background:var(--ok-soft);color:var(--ok)} .tag.free i{background:var(--ok)}
.tag.mine{background:var(--mine-soft);color:var(--mine)} .tag.mine i{background:var(--mine)}
.tag.busy{background:var(--raised);color:var(--muted)} .tag.busy i{background:var(--idle)}

.big{display:block;width:100%;text-align:center;padding:17px 14px;border-radius:13px;
  font-size:17px;font-weight:700;margin-top:14px;background:var(--raised);
  border:1px solid var(--rule);color:var(--text)}
.big.go{background:var(--ok);border-color:var(--ok);color:#fff}
.big.alt{background:var(--sheet)}
.big:active{opacity:.75}
.big[disabled]{opacity:.45}

.kv{display:flex;justify-content:space-between;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--rule-soft);font-size:16px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-weight:700;text-align:right}

.empty{text-align:center;color:var(--muted);padding:52px 22px;font-size:16px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
.note{background:var(--raised);border:1px solid var(--rule-soft);border-radius:13px;
  padding:14px 16px;font-size:15px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.note b{color:var(--text)}

.pick{width:100%;text-align:left;padding:16px;border-bottom:1px solid var(--rule-soft);font-size:17px}
.pick:active{background:var(--raised)}
input,select{width:100%;background:var(--raised);border:1px solid var(--rule);border-radius:11px;
  padding:14px;color:var(--text);font:inherit;font-size:16px;min-width:0}

.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--rule-soft);
  margin-bottom:16px;background:var(--map-bg)}
.mapbox .lf{height:260px}
.leaflet-tile-pane{filter:var(--tilefx)}
.leaflet-container{background:var(--map-bg);font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(128,128,128,.16)!important;color:var(--faint)!important}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:9px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--sheet)!important;color:var(--text)!important;border-color:var(--rule)!important}
.mmw{position:relative;overflow:hidden;background:var(--map-bg)}
.mmt{position:absolute;inset:0;filter:var(--tilefx)}
.mmt img{position:absolute;width:256px;height:256px;max-width:none}
.mmw svg{position:absolute;inset:0;width:100%;height:100%}

.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;color:var(--accent);font-size:15px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(8,11,14,.62);display:flex;align-items:flex-end;z-index:1100}
.sheet{background:var(--sheet);border-radius:18px 18px 0 0;width:100%;max-width:560px;margin:0 auto;
  padding:12px 18px calc(22px + var(--safe-b));max-height:88vh;max-height:88svh;overflow-y:auto}
.grab{display:block;width:40px;height:4px;border-radius:99px;background:var(--rule);margin:2px auto 16px;touch-action:none}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sh-sub{margin:0 0 14px;color:var(--muted);font-size:14px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--safe-b));background:var(--raised);
  border:1px solid var(--accent-dim);border-radius:13px;padding:13px 16px;display:none;z-index:1200;
  font-size:15px;max-width:528px;margin:0 auto}
#toast.on{display:block}
.spin{width:20px;height:20px;border:2px solid var(--rule);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Τομείς ανά περιοχή ---- */
.town-sec{margin-bottom:16px;border:1px solid var(--rule-soft);border-radius:16px;overflow:hidden;background:var(--sheet)}
.town-hdr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px 8px}
.town-nm{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.town-ct{font-size:12px;color:var(--ok);font-weight:700;background:var(--ok-soft);
  padding:3px 8px;border-radius:99px}
.town-map{height:240px;background:var(--map-bg);position:relative;overflow:hidden}
.town-map .mmw,.town-map>svg{width:100%!important;height:100%!important;display:block}
/* Chips: αριθμοί ελεύθερων τομέων, χρωματισμένοι κατά αναμονή */
.free-chips{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px 8px}
.fchip{display:flex;flex-direction:column;align-items:center;gap:0;color:#10161B;
  padding:5px 8px 4px;border-radius:9px;border:0;cursor:pointer;text-align:center;min-width:44px}
.fchip:active{opacity:.7}
.fc-num{font-size:16px;font-weight:800;line-height:1.1}
.fc-age{font-size:10px;font-weight:600;opacity:.85;white-space:nowrap}
.town-none{padding:8px 14px 10px;font-size:13px;color:var(--faint)}
.leaflet-tooltip.numlbl{background:transparent;border:0;box-shadow:none;padding:0;
  font-weight:800;font-size:13px;color:var(--text);
  text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg),0 0 2px var(--map-bg)}
.leaflet-tooltip.numlbl::before{display:none}
/* Επεξήγηση χρωμάτων */
.age-legend{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:14px;
  padding:12px 14px 10px;margin:0 0 14px}
.al-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.al-top b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.al-bar{height:18px;border-radius:99px}
.al-ticks{display:flex;justify-content:space-between;margin-top:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.al-more{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--faint)}
.al-more span{display:flex;align-items:center;gap:6px}
.al-dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 auto}
.al-dot.busy{background:var(--idle);opacity:.5} .al-dot.mine{background:var(--mine)}
/* Σύνδεσμος */
.lnk{color:var(--accent);font-weight:600;background:none;border:0;cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>

<div id="app">
  <header>
    <div><h1 id="ttl">Τομείς</h1><div class="who" id="who">φόρτωση…</div></div>
    <div class="hbtns">
      <button id="reloadBtn" onclick="manualRefresh()" title="Ανανέωση">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="themeBtn" onclick="toggleTheme()" title="Φωτεινό / σκοτεινό"></button>
    </div>
  </header>
  <main id="main"><div class="empty"><span class="spin"></span><br><br>Φόρτωση…</div></main>
  <nav id="nav">
    <button data-tab="free" class="on" onclick="go('free')">Ελεύθεροι τομείς</button>
    <button data-tab="mine" onclick="go('mine')">Οι τομείς μου</button>
  </nav>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ==================================================================
   Σελίδα αιτήσεων — ίδια δεδομένα, ίδια εμφάνιση με την εφαρμογή του
   υπευθύνου, αλλά μόνο: τι είναι ελεύθερο, ζήτησέ το, τι έχω.
   ================================================================== */
var API = 'https://script.google.com/macros/s/AKfycbwRUO7Zf1Ngkx3HSNbu1DjIjPaAo2RWF8MSYGdJZIZeLDE3k5Nk_gogN6YNIiYw8ffi/exec';

var D={territories:[],assignments:[],people:[],settings:{},requests:[],geo:null};
var lmaps={}, tab='free', detail=null, me=localStorage.getItem('tomeis_me')||'';

var TILES=[
  {u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
   credit:'Esri', max:19},
  {u:'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
   credit:'CARTO · OpenStreetMap', max:20}
];
function tileUrl(i,z,x,y){
  return TILES[i].u.replace('{z}',z).replace('{x}',x).replace('{y}',y);
}
/* αν ένα πλακίδιο δεν φορτώσει, δοκιμάζει την επόμενη πηγή */
function tileFail(img){
  var i=(+img.getAttribute('data-src')||0)+1;
  if(i>=TILES.length){ img.style.visibility='hidden'; return; }
  img.setAttribute('data-src',i);
  img.src=tileUrl(i,img.getAttribute('data-z'),img.getAttribute('data-x'),img.getAttribute('data-y'));
}
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ return new Date().toISOString().slice(0,10); }
function pd(s){ if(!s) return null; var p=String(s).slice(0,10).split('-');
  return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null; }
function fmt(d){ d=(typeof d==='string')?pd(d):d; if(!d) return '—';
  return d.toLocaleDateString('el-GR',{day:'2-digit',month:'short',year:'numeric'}); }
function addM(d,n){ var x=new Date(d.getTime()),day=x.getDate(); x.setMonth(x.getMonth()+n);
  if(x.getDate()<day) x.setDate(0); return x; }
function dys(a,b){ return Math.round((b-a)/86400000); }
function monthsSince(d,now){ var m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
  if(now.getDate()<d.getDate()) m--; return m+Math.max(0,dys(addM(d,m),now))/30; }
function dur(days){ days=Math.abs(Math.round(days));
  if(days<14) return {n:days,u:days===1?'ημέρα':'ημέρες'};
  if(days<60) return {n:Math.round(days/7),u:'εβδομάδες'};
  var m=days/30.44; return {n:(m<10?m.toFixed(1):Math.round(m)),u:'μήνες'}; }
function durTxt(d){ var x=dur(d); return x.n+' '+x.u; }
function monthsTxt(m){ if(m===Infinity) return 'ποτέ';
  if(m<1) return Math.round(m*30.44)+' ημέρες';
  if(m<2) return Math.round(m*30.44/7)+' εβδομάδες';
  return (m<10?m.toFixed(1):Math.round(m))+' μήνες'; }
function statusOf(t,now){
  var rows=D.assignments.filter(function(a){ return a.territory_id===t.id; });
  rows.sort(function(a,b){ return String(a.date_out).localeCompare(String(b.date_out)); });
  var open=null; rows.forEach(function(r){ if(!r.date_in) open=r; });
  if(open){
    var out=pd(open.date_out), due=addM(out,D.settings.hold_months), left=dys(now,due);
    return {state:left<0?'overdue':(left<=D.settings.warn_days?'due':'out'),
      holder:open.person,rowId:open.row_id,dateOut:out,dueOn:due,
      daysLeft:left,daysHeld:dys(out,now),rows:rows};
  }
  var rets=rows.filter(function(r){return r.date_in;}).map(function(r){return r.date_in;}).sort();
  var last=rets.length?rets[rets.length-1]:(t.last_completed||'');
  if(!last) return {state:'ready',rested:Infinity,never:true,band:5,rows:rows};
  var ld=pd(last), r=monthsSince(ld,now);
  if(r<D.settings.rest_months) return {state:'resting',rested:r,lastReturned:ld,readyOn:addM(ld,D.settings.rest_months),rows:rows};
  return {state:'ready',rested:r,band:r<6?1:r<8?2:r<10?3:r<12?4:5,lastReturned:ld,rows:rows};
}
function isOut(s){ return ['out','due','overdue'].indexOf(s.state)>=0; }
function geoOf(id){ return D.geo&&D.geo.maps?D.geo.maps[id]:null; }
function bboxOf(list){
  var b=null;
  list.forEach(function(t){ var g=geoOf(t.id); if(!g||!g.polygons) return;
    g.polygons.forEach(function(p){ p.coords.forEach(function(c){
      if(!b) b=[c[0],c[1],c[0],c[1]];
      else{ b[0]=Math.min(b[0],c[0]); b[1]=Math.min(b[1],c[1]);
            b[2]=Math.max(b[2],c[0]); b[3]=Math.max(b[3],c[1]); } }); }); });
  return b;
}
function wx(lng,z){ return (lng+180)/360*256*Math.pow(2,z); }
function wy(lat,z){ var r=lat*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z); }

/**
 * Μικρός χάρτης σε SVG: αληθινά πλακίδια OpenStreetMap στο φόντο
 * και από πάνω τα πολύγωνα. Χωρίς Leaflet — ελαφρύ για λίστες.
 */
function projOf(list,w,h,pad){
  var b=bboxOf(list); if(!b) return null;
  pad=pad==null?0.05:pad;
  var z=1;
  for(var zz=18;zz>=1;zz--){
    var pw=Math.abs(wx(b[3],zz)-wx(b[1],zz)), ph=Math.abs(wy(b[0],zz)-wy(b[2],zz));
    if(pw<=w*(1-2*pad) && ph<=h*(1-2*pad)){ z=zz; break; }
  }
  var x0=wx(b[1],z), x1=wx(b[3],z), y0=wy(b[2],z), y1=wy(b[0],z);
  return {z:z, ox:(w-(x1-x0))/2-x0, oy:(h-(y1-y0))/2-y0};
}
function numOf(t){ return String(t.id||'').replace(/^T0*/,''); }
function fillOp(s){ if(s.mine) return .5; if(s.state==='ready') return .32+.3*ageT(s.rested); return .16; }
/* σημείο ετικέτας: κέντρο βάρους του μεγαλύτερου πολυγώνου (σε pixel) */
function labelPt(gg,p){
  var best=null, ba=-1;
  gg.polygons.forEach(function(pl){
    var pts=pl.coords.map(function(c){ return [wx(c[1],p.z)+p.ox, wy(c[0],p.z)+p.oy]; });
    var A=0,cx=0,cy=0,n=pts.length;
    for(var i=0;i<n;i++){ var q=pts[i], r=pts[(i+1)%n], f=q[0]*r[1]-r[0]*q[1];
      A+=f; cx+=(q[0]+r[0])*f; cy+=(q[1]+r[1])*f; }
    A/=2;
    if(Math.abs(A)>ba){ ba=Math.abs(A);
      best=A?[cx/(6*A),cy/(6*A)]:pts[0]; }
  });
  return best;
}
function polyPaths(list,p,highlight,showNums){
  var out='', labels='';
  list.forEach(function(t){
    var gg=geoOf(t.id); if(!gg||!gg.polygons) return;
    var hi=!highlight||t.id===highlight;
    var c=highlight?(t.id===highlight?col(t.s):'var(--idle)'):col(t.s);
    var op=highlight?(hi?.6:.12):fillOp(t.s);
    var tap=(showNums&&!highlight)?' onclick="open_(\''+t.id+'\')" style="cursor:pointer"':'';
    gg.polygons.forEach(function(pl){
      var d=pl.coords.map(function(cc,i){
        return (i?'L':'M')+(wx(cc[1],p.z)+p.ox).toFixed(1)+' '+(wy(cc[0],p.z)+p.oy).toFixed(1); }).join('')+'Z';
      out+='<path d="'+d+'" fill="'+c+'" fill-opacity="'+op.toFixed(2)+'" stroke="'+c+'" '+
        'stroke-width="'+(hi&&t.s.state==='ready'?2:1.2)+'" stroke-linejoin="round"'+tap+'/>';
    });
    if(showNums){
      var lp=labelPt(gg,p); if(!lp) return;
      var free=t.s.state==='ready';
      labels+='<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="central" '+
        'font-size="'+(free?12:10)+'" font-weight="'+(free?800:600)+'" fill="var(--text)" '+
        'fill-opacity="'+(hi&&(free||t.s.mine||highlight)?1:.55)+'" stroke="var(--map-bg)" stroke-width="3" '+
        'stroke-linejoin="round" paint-order="stroke"'+tap+'>'+esc(numOf(t))+'</text>';
    }
  });
  return out+labels;
}
/** Μικρογραφία χωρίς πλακίδια — μόνο τα σχήματα. Ελαφριά, για λίστες. */

/**
 * Μικρός χάρτης ΜΕ πλακίδια: κανονικές <img> μέσα σε div, όπως ακριβώς κάνει
 * και το Leaflet στους μεγάλους χάρτες — το CSS filter δουλεύει έτσι παντού,
 * ενώ σε <image> μέσα σε SVG το Safari/iOS το αγνοεί.
 */
function projAt(list,w,h,z){
  var b=bboxOf(list); if(!b) return null;
  var x0=wx(b[1],z), x1=wx(b[3],z), y0=wy(b[2],z), y1=wy(b[0],z);
  return {z:z, ox:(w-(x1-x0))/2-x0, oy:(h-(y1-y0))/2-y0};
}
function tileSpan(p,w,h){
  return {x0:Math.floor((0-p.ox)/256), x1:Math.floor((w-p.ox)/256),
          y0:Math.floor((0-p.oy)/256), y1:Math.floor((h-p.oy)/256)};
}
/**
 * Μικρός χάρτης ΜΕ πλακίδια: κανονικές <img> μέσα σε div, όπως και το
 * Leaflet — έτσι δουλεύει το CSS filter παντού (και στο Safari).
 * Κρατάμε το πολύ 4 πλακίδια ανά μικρογραφία: ο διακομιστής χαρτών
 * μπλοκάρει εφαρμογές που ζητούν δεκάδες πλακίδια μαζί.
 */
function miniTiles(list,w,h,highlight,showNums){
  var p=projOf(list,w,h);
  if(!p) return '<div class="mmw" style="width:'+w+'px;height:'+h+'px"></div>';
  /* Ο αριθμός πλακιδίων εξαρτάται από το ΜΕΓΕΘΟΣ του πλαισίου, όχι από το ζουμ —
     γι' αυτό δεν κάνουμε ποτέ ζουμ-άουτ για να λιγοστέψουν. Αν χρειάζονται πολλά,
     κρατάμε όσα είναι πιο κοντά στο κέντρο (οι άκρες μένουν κενές, δεν πειράζει). */
  var MAX=8, n=Math.pow(2,p.z), sp=tileSpan(p,w,h), cands=[];
  for(var tx=sp.x0;tx<=sp.x1;tx++) for(var ty=sp.y0;ty<=sp.y1;ty++){
    if(ty<0||ty>=n) continue;
    var left=tx*256+p.ox, top=ty*256+p.oy;
    var dx=(left+128)-w/2, dy=(top+128)-h/2;
    cands.push({tx:tx,ty:ty,left:left,top:top,d:dx*dx+dy*dy});
  }
  cands.sort(function(a,b){ return a.d-b.d; });
  var imgs='';
  cands.slice(0,MAX).forEach(function(t){
    var xx=((t.tx%n)+n)%n;
    imgs+='<img alt="" data-src="0" data-z="'+p.z+'" data-x="'+xx+'" data-y="'+t.ty+'" '+
      'onerror="tileFail(this)" src="'+tileUrl(0,p.z,xx,t.ty)+'" '+
      'style="left:'+t.left.toFixed(1)+'px;top:'+t.top.toFixed(1)+'px">';
  });
  return '<div class="mmw" style="width:'+w+'px;height:'+h+'px">'+
    '<div class="mmt">'+imgs+'</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+polyPaths(list,p,highlight,showNums)+'</svg></div>';
}

function osm(m){

    var lyr=L.tileLayer(TILES[i].u,{maxZoom:TILES[i].max,attribution:'Χάρτης: '+TILES[i].credit});
    lyr.on('tileerror',function(){                 /* μία φορά: πέρνα στην εφεδρική πηγή */
      if(i+1>=TILES.length) return;
      i++; try{ m.removeLayer(lyr); }catch(e){} add();
    });
    lyr.addTo(m);
  };
  add();
}

      finish();
   });
}
function drawLeaflet(elId,list,opts){
  opts=opts||{};
  var el=document.getElementById(elId); if(!el) return;
  if(lmaps[elId]){ try{ lmaps[elId].remove(); }catch(e){} }
  var mo={zoomControl:opts.zoom!==false,attributionControl:true};
  var touch=L.Browser.touch;
  if(opts.town){ mo.zoomSnap=.25; mo.zoomDelta=.75; mo.scrollWheelZoom=false; mo.dragging=!touch; }
  var m=L.map(el,mo);
  lmaps[elId]=m; osm(m);
  var b=null, focus=opts.focus;
  list.forEach(function(t){
    var g=geoOf(t.id); if(!g||!g.polygons) return;
    var main = !focus || t.id===focus;
    var c = main?col(t.s):'var(--idle)';
    g.polygons.forEach(function(p,pi){
      var poly=L.polygon(p.coords,{color:c,weight:main?2.6:1.5,fillOpacity:main?(focus?.34:fillOp(t.s)):.14,
        fillColor:c,interactive:true}).addTo(m);
      if(pi===0) poly.bindTooltip(numOf(t),{permanent:true,direction:'center',className:'numlbl',opacity:main?1:.6});
      poly.on('click',function(){
        if(opts.onPick && (!focus || t.id!==focus)) opts.onPick(t.id);
        else poly.bindTooltip(t.name,{className:'maplbl',direction:'top'}).openTooltip();
      });
      b=b?b.extend(poly.getBounds()):poly.getBounds();   // πάντα όλη η περιοχή
    });
    if(main) (g.points||[]).forEach(function(pt){
      L.circleMarker(pt.at,{radius:5,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).addTo(m); });
  });
  if(b) m.fitBounds(b,{padding:opts.town?[6,6]:[10,10]}); else m.setView([40.27,23.27],11);
  /* στο κινητό: με ένα δάχτυλο κυλάει η σελίδα· αφού μεγεθύνει, μετακινεί και τον χάρτη */
  if(opts.town && touch){ var base=m.getZoom();
    m.on('zoomend',function(){ if(m.getZoom()>base+.1) m.dragging.enable(); else m.dragging.disable(); }); }
  setTimeout(function(){ try{ m.invalidateSize(); }catch(e){} },60);
  return m;
}

/* ---------- χρώματα: ελεύθεροι κατά αναμονή (a1→a5), δικός σου μπλε, υπόλοιποι γκρι ---------- */
function col(s){ if(s.mine) return 'var(--mine)'; if(s.state==='ready') return ageCol(s.rested); return 'var(--idle)'; }
/* 0 = μόλις ελευθερώθηκε (≤6μ) … 1 = 12 μήνες και πάνω ή ποτέ */
function ageT(m){ if(m===Infinity) return 1; return Math.max(0,Math.min(1,(m-6)/6)); }
/* ομαλή μετάβαση: πράσινο → κίτρινο → κόκκινο (ενδιάμεσοι τόνοι για απαλό πέρασμα) */
var AGE_RGB=[[64,170,126],[150,186,94],[232,193,76],[236,144,76],[222,86,66]];
function ageMix(t){
  var n=AGE_RGB.length-1, x=Math.max(0,Math.min(1,t))*n, i=Math.min(n-1,Math.floor(x)), f=x-i,
      a=AGE_RGB[i], b=AGE_RGB[i+1];
  return 'rgb('+[0,1,2].map(function(k){ return Math.round(a[k]+(b[k]-a[k])*f); }).join(',')+')';
}
function ageCol(m){ return ageMix(ageT(m)); }
function ageGrad(){ var st=[]; for(var i=0;i<=12;i++) st.push(ageMix(i/12)+' '+(i/12*100).toFixed(1)+'%');
  return 'linear-gradient(90deg,'+st.join(',')+')'; }
function ageShort(m){ if(m===Infinity) return 'ποτέ'; if(m<1) return Math.round(m*30.44)+'η'; return Math.floor(m)+'μ'; }

function refresh(then){
  /* Το .catch πιάνει ΜΟΝΟ το δίκτυο — αλλιώς ένα λάθος στην οθόνη θα
     εμφανιζόταν σαν πρόβλημα σύνδεσης και θα κρυβόταν η επιβεβαίωση. */
  return fetch(API+'?geo=0',{redirect:'follow'}).then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error||'σφάλμα');
      var geo=D.geo; apply(j); D.geo=geo;
      var k=cacheGet()||{}; j.boundaries=k.boundaries||geo||null; cacheSet(j);
      render(); return j;
    })

      if(!j.ok){ alert('Σφάλμα: '+j.error); return; }
      done(j); })
    .catch(function(){ alert('Αποτυχία αποστολής — ελέγξτε τη σύνδεση.'); });
}
var toastT;
function toast(msg){ var e=$('#toast'); e.textContent=msg; e.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ e.classList.remove('on'); },3600); }

/* ---------- πλοήγηση ---------- */
function go(t){ tab=t; detail=null; render(); $('#main').scrollTop=0; }
function open_(id){ detail=id; render(); $('#main').scrollTop=0; }
function render(){
  Object.keys(lmaps).forEach(function(k){ try{ lmaps[k].remove(); }catch(e){} delete lmaps[k]; });
  document.querySelectorAll('#nav button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tab')===tab); });
  $('#who').innerHTML = me ? ('<b>'+esc(me)+'</b> · αλλαγή') : 'Επιλογή ονόματος';
  if(!me) return viewPickName();
  if(detail) return viewDetail();
  if(tab==='mine') return viewMine();
  viewFree();
}

/* ---------- ποιος είσαι ---------- */
function viewPickName(){
  $('#ttl').textContent='Επιλογή ονόματος';
  var names=D.people.filter(function(p){ return String(p.active).toUpperCase()!=='FALSE'; })
    .map(function(p){ return p.name; })
    .filter(function(n){ return n && !/^(Όμιλος|Ομαδική|Τηλεφωνικός)/.test(n); })
    .sort(function(a,b){ return a.localeCompare(b,'el'); });
  $('#main').innerHTML='<p class="lead" style="font-size:14px">Αποθηκεύεται σε αυτή τη συσκευή.</p>'+
    '<input id="nq" placeholder="Αναζήτηση επωνύμου" oninput="filterNames()">'+
    '<div id="nlist" style="margin-top:14px;background:var(--sheet);border:1px solid var(--rule-soft);'+
    'border-radius:14px;overflow:hidden">'+
    names.map(function(n){ return '<button class="pick" data-n="'+esc(n)+'" onclick="setMe(this.getAttribute(\'data-n\'))">'+esc(n)+'</button>'; }).join('')+
    '</div>';
}
function filterNames(){
  var v=($('#nq').value||'').toLowerCase();
  document.querySelectorAll('#nlist .pick').forEach(function(b){
    b.style.display = b.textContent.toLowerCase().indexOf(v)>=0 ? '' : 'none'; });
}
function setMe(n){ me=n; try{ localStorage.setItem('tomeis_me',n); }catch(e){} tab='free'; render(); }
function changeMe(){ if(confirm('Αλλαγή ονόματος;')){ me=''; localStorage.removeItem('tomeis_me'); render(); } }

/* ---------- ελεύθεροι τομείς: ανά περιοχή ---------- */
function towns(){
  var order=[], map={};
  all().slice().sort(function(a,b){ return String(a.id).localeCompare(String(b.id),'el',{numeric:true}); })
    .forEach(function(t){ if(!map[t.town]){ map[t.town]=[]; order.push(t.town); } map[t.town].push(t); });
  var w=function(t){ return t.s.rested===Infinity?1e9:t.s.rested; };
  return order.map(function(n,i){
    var free=map[n].filter(function(t){ return t.s.state==='ready'; })
      .sort(function(a,b){ return w(b)-w(a); });
    return {name:n, list:map[n], free:free, i:i, need:free.length?w(free[0]):-1,
      old:free.filter(function(t){ return t.s.rested>=12; }).length}; })
    /* πρώτα οι περιοχές με τους πιο παλιούς ελεύθερους τομείς */
    .sort(function(a,b){ return (b.need-a.need)||(b.old-a.old)||(b.free.length-a.free.length)||(a.i-b.i); });
}
function viewFree(){
  var mine=all().filter(function(t){ return t.s.mine; });
  var pend=myPending(), tw=towns();
  var nFree=tw.reduce(function(n,x){ return n+x.free.length; },0);
  $('#ttl').textContent='Ελεύθεροι τομείς';

  var h='';
  if(pend.length) h+='<div class="note"><b>Σε αναμονή:</b> '+
    pend.map(function(r){ var t=byId(r.territory_id);
      return esc(t?numOf(t)+' '+shortName(t):r.territory_id); }).join(', ')+'</div>';
  if(mine.length) h+='<div class="note"><b>Έχεις '+mine.length+' '+(mine.length===1?'τομέα':'τομείς')+':</b> '+
    mine.map(function(t){ return esc(numOf(t)+' '+shortName(t)); }).join(', ')+
    ' · <button class="lnk" onclick="go(\'mine\')">Προβολή</button></div>';

  if(!nFree) h+='<div class="empty"><b>Κανένας ελεύθερος τομέας</b></div>';
  h+='<div class="age-legend"><div class="al-top"><b>Αναμονή</b></div>'+
    '<div class="al-bar" style="background:'+ageGrad()+'"></div>'+
    '<div class="al-ticks"><span>6μ</span><span>9μ</span><span>12μ+</span></div>'+
    '<div class="al-more"><span><i class="al-dot busy"></i>σε χρήση</span>'+
    (mine.length?'<span><i class="al-dot mine"></i>δικός σου</span>':'')+'</div></div>';

  tw.forEach(function(x,i){
    h+='<div class="town-sec">'+
      '<div class="town-hdr"><span class="town-nm">'+esc(x.name)+'</span>'+
      '<span class="town-ct"'+(x.free.length?'':' style="color:var(--faint);background:var(--raised)"')+'>'+
        x.free.length+' / '+x.list.length+' ελεύθεροι</span></div>'+
      '<div class="town-map" id="tm'+i+'" data-town="'+i+'" style="height:'+townH(x)+'px">'+
        miniSvg(x.list,520,townH(x),null,true)+'</div>';
    if(x.free.length){
      h+='<div class="free-chips">'+x.free.map(function(t){
        return '<button class="fchip" style="background:'+ageCol(t.s.rested)+'" onclick="open_(\''+t.id+'\')" title="'+esc(shortName(t))+'">'+
          '<span class="fc-num">'+esc(numOf(t))+'</span><span class="fc-age">'+ageShort(t.s.rested)+'</span></button>';
      }).join('')+'</div>';
    } else h+='<div class="town-none">Κανένας ελεύθερος</div>';
    h+='</div>';
  });
  $('#main').innerHTML=h;
  lazyTownMaps(tw);
}
/* ύψος χάρτη: περισσότεροι τομείς → μεγαλύτερος χάρτης */
function townH(x){
  var h=Math.min(400,200+x.list.length*12);
  if(/πολ[υύ]γυρ/i.test(x.name)) h=Math.max(h,440);
  return h;
}
function lazyTownMaps(tw){
  var els=document.querySelectorAll('.town-map[data-town]');
  /* κανονικός χάρτης Leaflet: ζουμ με δύο δάχτυλα ή +/−, πάτημα σε τομέα → προβολή */
  var fill=function(el){ var x=tw[+el.getAttribute('data-town')]; if(!x) return;
    if(!x.list.some(function(t){ var g=geoOf(t.id); return g&&g.polygons&&g.polygons.length; })) return;
    el.innerHTML='';
    drawLeaflet(el.id, x.list, {town:true, onPick:open_}); };
  if(!('IntersectionObserver' in window)){ els.forEach(fill); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
    if(!e.isIntersecting) return; fill(e.target); io.unobserve(e.target); }); },{rootMargin:'300px 0px'});
  els.forEach(function(el){ io.observe(el); });
}
function lazyTiles(list){
  var els=document.querySelectorAll('.mini[data-mm]');
  var fill=function(el){ var t=byId(el.getAttribute('data-id')); if(!t) return;
    el.innerHTML=miniTiles(inTown(t.town), el.clientWidth||320, el.clientHeight||132, t.id, true); };
  if(!('IntersectionObserver' in window)){ els.forEach(fill); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
    if(!e.isIntersecting) return; fill(e.target); io.unobserve(e.target); }); },{rootMargin:'300px 0px'});
  els.forEach(function(el){ io.observe(el); });
}

/* ---------- ο τομέας μου ---------- */
function viewMine(){
  var mine=all().filter(function(t){ return t.s.mine; });
  var pend=myPending();
  $('#ttl').textContent='Οι τομείς μου';
  var h='';
  if(!mine.length && !pend.length)
    h+='<div class="empty"><b>Κανένας τομέας</b>'+
       '<button class="lnk" onclick="go(\'free\')">Ελεύθεροι τομείς ›</button></div>';
  if(pend.length) h+='<div class="note"><b>Σε αναμονή</b><br>'+
    pend.map(function(r){ var t=byId(r.territory_id);
      return esc(t?numOf(t)+' '+shortName(t)+' — '+t.town:r.territory_id)+
      ' · <button class="lnk" onclick="cancelReq(\''+esc(r.row_id)+'\')">Ακύρωση</button>'; }).join('<br>')+'</div>';

  mine.forEach(function(t,i){
    var s=t.s, late=s.daysLeft<0;
    h+='<div class="card"><button style="display:block;width:100%" onclick="open_(\''+t.id+'\')">'+
      '<div class="mini" data-mm="'+i+'" data-id="'+t.id+'">'+miniSvg(inTown(t.town),320,132,t.id,true)+'</div>'+
      '<div class="body" style="text-align:left"><div class="nm">'+esc(numOf(t))+' · '+esc(shortName(t))+'</div>'+
      '<div class="sub">'+esc(t.town)+'</div>'+
      '<span class="tag mine"><i></i>'+(late?('Εκπρόθεσμος · '+durTxt(s.daysLeft)):('Απομένουν '+durTxt(s.daysLeft)))+'</span>'+
      '</div></button></div>';
  });

  var past=D.assignments.filter(function(a){ return a.person===me && a.date_in; })
    .sort(function(a,b){ return String(b.date_in).localeCompare(String(a.date_in)); }).slice(0,12);
  if(past.length){
    h+='<h2 class="sec" style="margin-top:24px">Ιστορικό</h2>';
    past.forEach(function(a){ var t=byId(a.territory_id);
      h+='<div class="kv"><span>'+esc(t?numOf(t)+' '+shortName(t)+' — '+t.town:a.territory_id)+'</span>'+
         '<b>'+fmt(a.date_in)+'</b></div>'; });
  }
  $('#main').innerHTML=h;
  lazyTiles(mine);
}

/* ---------- ένας τομέας ---------- */
function viewDetail(){
  var t=byId(detail); if(!t){ detail=null; return render(); }
  var s=t.s, free=(s.state==='ready');
  $('#ttl').textContent=shortName(t);
  var h='<button class="back" onclick="detail=null;render()">‹ Πίσω</button>'+
    '<div class="mapbox"><div class="lf" id="dMap"></div></div>'+
    '<div class="nm" style="font-size:20px;font-weight:700">'+esc(numOf(t))+' · '+esc(shortName(t))+'</div>'+
    '<div class="sub" style="color:var(--muted);margin:2px 0 10px">'+esc(t.town)+'</div>';

  if(s.mine){
    h+='<span class="tag mine"><i></i>Ανατεθειμένος σε εσένα</span>'+
      '<div style="margin-top:16px">'+
      '<div class="kv"><span>Ανάθεση</span><b>'+fmt(s.dateOut)+'</b></div>'+
      '<div class="kv"><span>Επιστροφή έως</span><b>'+fmt(s.dueOn)+'</b></div>'+
      '<div class="kv"><span>'+(s.daysLeft<0?'Καθυστέρηση':'Απομένουν')+'</span><b>'+durTxt(s.daysLeft)+'</b></div>'+
      '</div>'+
      '<button class="big go" onclick="openMaps(\''+t.id+'\')">Google Maps</button>'+
      '<button class="big alt" onclick="makeCard(byId(\''+t.id+'\'),\'download\')">Κάρτα PDF</button>'+
      '<button class="big" onclick="declareDone(\''+t.id+'\')">Δήλωση ολοκλήρωσης</button>';
  } else if(free){
    h+='<span class="tag free" style="background:'+ageCol(s.rested)+';color:#10161B"><i style="background:#10161B"></i>'+
        'Ελεύθερος · αναμονή '+monthsTxt(s.rested)+'</span>'+
      '<div style="margin-top:16px">'+
      '<div class="kv"><span>Τελευταία ολοκλήρωση</span><b>'+(s.lastReturned?fmt(s.lastReturned):'—')+'</b></div>'+
      '<div class="kv"><span>Αναμονή</span><b>'+monthsTxt(s.rested)+'</b></div>'+
      '</div>'+
      '<button class="big go" onclick="askFor(\''+t.id+'\')">Αίτηση ανάθεσης</button>'+
      '<button class="big alt" onclick="openMaps(\''+t.id+'\')">Google Maps</button>';
  } else {
    var rest=s.state==='resting';
    h+='<span class="tag busy"><i></i>'+(rest?'Μη διαθέσιμος έως '+fmt(s.readyOn):'Σε χρήση')+'</span>'+
      '<button class="big" style="margin-top:18px" onclick="askFor(\''+t.id+'\')">Αίτηση αναμονής</button>';
  }
  $('#main').innerHTML=h;
  var g=geoOf(t.id);
  if(g&&g.polygons&&g.polygons.length) drawLeaflet('dMap',inTown(t.town),{focus:t.id,quiet:true});
  else document.getElementById('dMap').innerHTML='<div class="empty">Φόρτωση χάρτη…</div>';
}
function openMaps(id){ var t=byId(id); if(t&&t.mymaps_id)
  window.open('https://www.google.com/maps/d/viewer?mid='+t.mymaps_id,'_blank'); }

/* ---------- ενέργειες ---------- */
function sheet(html){
  var d=document.createElement('div'); d.className='scrim';
  d.innerHTML='<div class="sheet"><span class="grab"></span>'+html+'</div>';
  d.onclick=function(e){ if(e.target===d) d.remove(); };
  document.body.appendChild(d); return d;
}
function askFor(id){
  var t=byId(id), free=(t.s.state==='ready');
  var d=sheet('<h3>'+(free?'Αίτηση ανάθεσης':'Αίτηση αναμονής')+'</h3>'+
    '<div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+' — '+esc(t.town)+'</div>'+
    (free?'<div class="kv"><span>Επιστροφή έως</span><b>'+fmt(addM(new Date(),D.settings.hold_months))+'</b></div>'
         :'<div class="kv"><span>Κατάσταση</span><b>Λίστα αναμονής</b></div>')+
    '<button class="big go" id="yes">Επιβεβαίωση</button>'+
    '<button class="big" id="no">Άκυρο</button>');
  d.querySelector('#no').onclick=function(){ d.remove(); };
  d.querySelector('#yes').onclick=function(){
    d.remove(); toast('Αποστολή…');
    post({action:'request',person:me,territory:id},function(j){
      refresh(function(){
        if(j.assigned){ tab='mine'; detail=id; render();
          sheet('<h3>Ανατέθηκε</h3><div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+'</div>'+
            '<div class="kv"><span>Επιστροφή έως</span><b>'+fmt(addM(new Date(),D.settings.hold_months))+'</b></div>'+
            '<button class="big go" onclick="this.closest(\'.scrim\').remove()">OK</button>');
        } else {
          render();
          sheet('<h3>Σε αναμονή</h3><div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+
            ' — δεν είναι πλέον ελεύθερος.</div>'+
            '<button class="big go" onclick="this.closest(\'.scrim\').remove()">OK</button>');
        }
      });
    });
  };
}
function cancelReq(rowId){
  if(!confirm('Να ακυρωθεί το αίτημα;')) return;
  post({action:'cancelReq',rowId:rowId},function(){ refresh(function(){ toast('Η αίτηση ακυρώθηκε'); }); });
}
function declareDone(id){
  var t=byId(id);
  var d=sheet('<h3>Δήλωση ολοκλήρωσης</h3>'+
    '<div class="sh-sub">'+esc(numOf(t))+' · '+esc(shortName(t))+' — '+esc(t.town)+'</div>'+
    '<div class="kv"><span>Ημερομηνία επιστροφής</span><b>'+fmt(new Date())+'</b></div>'+
    '<button class="big go" id="yes">Επιβεβαίωση</button>'+
    '<button class="big" id="no">Άκυρο</button>');
  d.querySelector('#no').onclick=function(){ d.remove(); };
  d.querySelector('#yes').onclick=function(){ d.remove(); toast('Αποστολή…');
    post({action:'declareReturn',territory:id,date:today()},function(){
      refresh(function(){ detail=null; tab='free'; render(); toast('Καταχωρήθηκε'); }); }); };
}

applyTheme();
$('#who').onclick=function(){ if(me) changeMe(); };
load();
</script>
