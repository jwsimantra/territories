<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap">
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}

.scrim{position:fixed;inset:0;background:rgba(5,8,10,.35);z-index:900}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--sheet);border-top:1px solid var(--rule);border-radius:20px 20px 0 0;max-width:540px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -20px 40px -20px rgba(0,0,0,.6);animation:up .2s ease-out;max-height:82%;overflow-y:auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.hint{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--rule);margin:0 auto 14px}
.ph{display:flex;align-items:center;gap:14px}
.badge{width:58px;height:58px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:25px;font-variant-numeric:tabular-nums;
  background-color:var(--tc);color:#151C22;background-image:repeating-linear-gradient(118deg,rgba(255,255,255,.22) 0 1.5px,transparent 1.5px 4.5px)}
.ph b{display:block;font-size:20px;font-weight:700;letter-spacing:-.015em}
.ph .sub{display:block;color:var(--muted);font-size:14px}
.ph .holder{display:block;color:var(--faint);font-size:12.5px;margin-top:3px}
.ph .x{margin-left:auto;align-self:flex-start;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--raised);cursor:pointer;font-size:20px;line-height:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--rule);background:var(--raised);color:var(--text);cursor:pointer;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);grid-column:1/-1}
.btn.pri svg.ic .d{fill:var(--accent-ink);fill-opacity:.35}
.btn.wide{grid-column:1/-1}
.btn[disabled]{opacity:.6;cursor:progress}
.reqbtn{display:flex;align-items:center;gap:12px;margin-top:10px;padding:13px 14px;border-radius:14px;border:2px solid var(--accent);background:var(--wash);color:var(--text);text-decoration:none}
.reqbtn svg.ic{width:26px;height:26px;color:var(--accent)}
.reqbtn b{display:block;font-size:16px;font-weight:800;color:var(--accent)}
.reqbtn small{display:block;font-size:12.5px;color:var(--muted)}
.reqbtn .go{margin-left:auto;font-size:20px;font-weight:700;color:var(--accent)}
.reqnote{margin:14px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.reqnote a{color:var(--accent);font-weight:600}
.soonlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.soonlist a{min-width:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);text-align:center;font-weight:700;text-decoration:none}
.people{display:flex;flex-direction:column;margin-top:14px;border:1px solid var(--soft);border-radius:12px;overflow:hidden}
.people button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:0;border-top:1px solid var(--soft);background:none;text-align:left;cursor:pointer;font-size:15.5px;font-weight:600}
.people button:first-child{border-top:0}
.people button:hover{background:var(--raised)}
.people button span{color:var(--faint);font-size:13px;font-weight:500}
.people button[aria-pressed="true"]{background:var(--wash);color:var(--accent)}
.small{font-size:12.5px;color:var(--faint);margin:12px 0 0}
.boardver{text-align:center;font-size:10px;letter-spacing:.06em;color:var(--faint);opacity:.75;margin:6px 0 14px}

// ---------- geometry ----------
function labelPoint(ll){
  const k = Math.cos(ll[0][0]*Math.PI/180);
  const P = ll.map(([la,lo]) => [lo*k, la]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const inside = p => { let c = false;
    for (let i = 0, j = P.length-1; i < P.length; j = i++) { const [xi,yi] = P[i], [xj,yj] = P[j];
      if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj-xi)*(p[1]-yi)/(yj-yi) + xi) c = !c; }
    return c; };
  const seg = (p,a,b) => { const dx = b[0]-a[0], dy = b[1]-a[1], L = dx*dx+dy*dy;
    let u = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; u = Math.max(0, Math.min(1, u));
    return Math.hypot(p[0]-a[0]-u*dx, p[1]-a[1]-u*dy); };
  let best = [(x0+x1)/2, (y0+y1)/2], bd = -1; const N = 26;
  for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
    const p = [x0+(x1-x0)*i/N, y0+(y1-y0)*j/N]; if (!inside(p)) continue;
    let d = Infinity; for (let q = 0; q < P.length-1; q++) d = Math.min(d, seg(p, P[q], P[q+1]));
    if (d > bd) { bd = d; best = p; } }
  return [best[1], best[0]/k];
}
Object.values(T).forEach(t => { if (t.ll) t.lp = labelPoint(t.ll); });

// ---------- geometry in screen pixels (for fitting numbers) ----------
const merc = (lat, lon, z) => { const s = 256 * 2**z, r = lat*Math.PI/180;
  return [(lon+180)/360*s, (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*s]; };
const segD = (p, a, b) => { const dx = b[0]-a[0], dy = b[1]-a[1], L = dx*dx + dy*dy;
  let u = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; u = Math.max(0, Math.min(1, u));
  return Math.hypot(p[0]-a[0]-u*dx, p[1]-a[1]-u*dy); };
/* πόσο «χώρο» έχει ο αριθμός: απόσταση από το κοντινότερο όριο */
const innerR = (c, P) => { let d = Infinity; for (let i = 0; i < P.length; i++) d = Math.min(d, segD(c, P[i], P[(i+1) % P.length])); return d; };
/* προς τα έξω από το κέντρο της περιοχής */
const outDir = (c, o) => { const dx = c[0]-o[0], dy = c[1]-o[1], L = Math.hypot(dx, dy); return L < 1e-6 ? [1, 0] : [dx/L, dy/L]; };
/* πόσο μακριά είναι το όριο προς αυτή την κατεύθυνση */
const edgeDist = (c, d, P) => { let best = Infinity;
  for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i+1) % P.length], ex = b[0]-a[0], ey = b[1]-a[1];
    const den = d[0]*ey - d[1]*ex; if (Math.abs(den) < 1e-9) continue;
    const t = ((a[0]-c[0])*ey - (a[1]-c[1])*ex) / den, u = ((a[0]-c[0])*d[1] - (a[1]-c[1])*d[0]) / den;
    if (t > 0 && u >= 0 && u <= 1 && t < best) best = t; }
  return best === Infinity ? 0 : best; };
const NUM_PX = 15;                                  // ίδιο μέγεθος αριθμού παντού (χάρτης)
const BOARD_PX = 20;                                // στον πίνακα: μεγαλύτερος, χωρίς περίγραμμα

/* θέση έξω από τον τομέα που δεν πέφτει πάνω σε άλλον αριθμό: δοκιμάζει γωνίες γύρω από την κατεύθυνση «προς τα έξω» */
const overlaps = (b, boxes) => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
function placeOut(c, P, d, w, h, gap, boxes){
  const base = Math.atan2(d[1], d[0]);
  for (const step of [0, .6, -.6, 1.2, -1.2, 1.9, -1.9, Math.PI]) for (const extra of [0, 14]) {
    const a = base + step, dir = [Math.cos(a), Math.sin(a)], ed = edgeDist(c, dir, P);
    const r = ed + gap + extra + Math.abs(dir[0])*w/2 + Math.abs(dir[1])*h/2;
    const x = c[0] + dir[0]*r, y = c[1] + dir[1]*r, b = [x-w/2-2, y-h/2-2, x+w/2+2, y+h/2+2];
    if (!overlaps(b, boxes)) return {x, y, b, dir, ed};
  }
  return null;
}

const OVERPASS = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const ROAD_RANK = {motorway:3, trunk:3, primary:3, secondary:3, motorway_link:3, trunk_link:3, primary_link:3, secondary_link:3, tertiary:2, tertiary_link:2};
let ROADS = [];
function loadRoads(){
  try { const c = JSON.parse(localStorage.getItem('tb-roads') || 'null');
    if (c && c.at > Date.now() - 7*864e5 && c.roads && c.roads.length) return Promise.resolve(c.roads); } catch (e) {}
  const pts = Object.values(T).flatMap(t => t.ll || []); if (!pts.length) return Promise.resolve([]);
  const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
  const bb = [Math.min(...la)-.01, Math.min(...lo)-.01, Math.max(...la)+.01, Math.max(...lo)+.01].map(v => v.toFixed(4)).join(',');
  const q = '[out:json][timeout:25];way["highway"~"^(' + Object.keys(ROAD_RANK).join('|') + ')$"](' + bb + ');out tags geom;';
  const at = i => i >= OVERPASS.length ? Promise.resolve([]) :
    fetch(OVERPASS[i], {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}})
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => (j.elements || []).filter(x => x.geometry && x.geometry.length > 1).map(x => ({
        r: ROAD_RANK[(x.tags || {}).highway] || 2, pts: x.geometry.map(g => [+g.lat.toFixed(5), +g.lon.toFixed(5)]) })))
      .catch(() => at(i+1));

}

/* δρόμοι μέσα σε έναν πίνακα (σε pixel του ζουμ z) */
function roadsSVG(z, vx, vy, vw, vh, OX, OY){

  [2,3].forEach(r => ROADS.filter(x => x.r === r).forEach(x => {
    const P = x.pts.map(p => { const q = merc(p[0], p[1], z); return [q[0]-OX, q[1]-OY]; });
    if (!P.some(p => p[0] > vx && p[0] < vx+vw && p[1] > vy && p[1] < vy+vh)) return;
    const d = 'M' + P.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    out += `<path class="road" d="${d}" stroke="var(${r === 3 ? '--road-main-case' : '--road-minor-case'})" stroke-width="${r === 3 ? 4.2 : 3}" opacity=".7"/>` +

  }));

}

function placeLabels(){
  const z = map.getZoom(); leaders.clearLayers();
  const k = 1/(256*2**z), un = p => { const y = Math.PI*(1 - 2*p[1]*k); return [Math.atan(Math.sinh(y))*180/Math.PI, p[0]*k*360 - 180]; };

    if (P.length) ctr[tw.name] = [P.reduce((a,p) => a+p[0], 0)/P.length, P.reduce((a,p) => a+p[1], 0)/P.length]; });

    boxes.push(o.b); i.t.label.setLatLng(un([o.x, o.y])); i.t.label.setOpacity(1);

  'Πορταριά':[3,{10:'1/1/3/2',11:'1/2/2/3',12:'1/3/2/4',13:'2/2/3/4'}],
  'Όλυνθος':[2,{14:'1/1/2/3',15:'2/1/3/2',16:'3/1/4/2',17:'4/1/5/2',18:'2/2/5/3'}], 'Παντελίδας':[1,{69:'1/1/2/2'}]

function sheetSVG(tw, big){
  const ts = tw.ns.map(n => T[n]), dark = isDark(), target = big ? 860 : 420;
  let z = 16;
  for (; z > 10; z--) { const P = ts.flatMap(t => t.ll.map(p => merc(p[0], p[1], z)));
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    if (Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)) <= target) break; }
  const all = ts.flatMap(t => t.ll.map(p => merc(p[0], p[1], z)));
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs)-x0, h = Math.max(...ys)-y0, W = Math.max(w, h), pad = W*.1 + 12;
  const OX = Math.floor(x0-pad), OY = Math.floor(y0-pad);           // αρχή τοπικών συντεταγμένων
  const M = (la, lo) => { const p = merc(la, lo, z); return [p[0]-OX, p[1]-OY]; };
  const vx = x0-pad-OX, vy = y0-pad-OY, vw = w+2*pad, vh = h+2*pad, id = 'v' + tw.ns[0];
  const c0 = [all.reduce((a,p) => a+p[0], 0)/all.length - OX, all.reduce((a,p) => a+p[1], 0)/all.length - OY];
  let s = `<svg class="bsvg" viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="${tw.name}">
    <defs><clipPath id="${id}"><rect x="${vx.toFixed(1)}" y="${vy.toFixed(1)}" width="${vw.toFixed(1)}" height="${vh.toFixed(1)}" rx="${(W*.02).toFixed(1)}"/></clipPath>
    <pattern id="pen${tw.ns[0]}" patternUnits="userSpaceOnUse" width="${(W/120).toFixed(2)}" height="${(W/120).toFixed(2)}" patternTransform="rotate(28)"><rect width="${(W/360).toFixed(2)}" height="${(W/120).toFixed(2)}" fill="rgba(255,255,255,.3)"/></pattern></defs>
    <g class="tiles" clip-path="url(#${id})">`;
  for (let X = Math.floor((vx+OX)/256); X <= Math.floor((vx+OX+vw)/256); X++)
    for (let Y = Math.floor((vy+OY)/256); Y <= Math.floor((vy+OY+vh)/256); Y++)
      s += `<image href="${BASE_TILE(dark)}${z}/${Y}/${X}" x="${X*256-OX}" y="${Y*256-OY}" width="256.6" height="256.6" preserveAspectRatio="none"/>`;
  s += '</g>';

    labels += `<g class="bl" data-ln="${t.n}"><path d="${d}" fill="none" style="display:none"/>
      <line class="lead" visibility="hidden"/><text x="${c[0].toFixed(1)}" y="${c[1].toFixed(1)}" data-x="${c[0].toFixed(1)}" data-y="${c[1].toFixed(1)}"
        data-r="${innerR(c, P).toFixed(1)}" data-dx="${dir[0].toFixed(3)}" data-dy="${dir[1].toFixed(3)}" data-ed="${ed.toFixed(1)}">${t.n}</text></g>`;
  });
  return s + labels + '</svg>';
}
/* μετά τη σχεδίαση: ίδιο μέγεθος αριθμού σε όλους τους πίνακες· αν δεν χωράει, δίπλα στον τομέα με μια γραμμή */
function fitBoardLabels(){

    });

      i.ln.setAttribute('stroke-width', (1.3/k).toFixed(2)); i.ln.setAttribute('visibility', 'visible');

      if (z >= 14) {
        g.strokeStyle = css('--fk-street'); g.lineWidth = Math.max(1.5, 8/mpp);
        for (let k = Math.floor(ox/step) - 1; k*step < ox + 257; k++) { const x = k*step - ox + (hash(k)-.5)*step*.5;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (hash(k+9)-.5)*40, 256); g.stroke(); }
        for (let k = Math.floor(oy/step) - 1; k*step < oy + 257; k++) { const y = k*step - oy + (hash(k+50)-.5)*step*.5;
          g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + (hash(k+77)-.5)*40); g.stroke(); }
      }
      g.restore();
    });
    return cv;
  }});
  fakeLayer = new Fake({pane:'tilePane', attribution:'Δοκιμαστικός χάρτης'}).addTo(map);
  // made-up main roads between the villages, so the page reads like a map
  const ctr = name => { const b = townBox(TOWNS.find(t => t.name === name)); return b && b.getCenter(); };
  const ROUTES = [['Πολύγυρος','Παλαιόκαστρο','Γεροπλάτανος','Ρίζα','Παλαιόχωρα'],['Πολύγυρος','Ταξιάρχης','Βράσταμα','Κελλί'],['Πολύγυρος','Σήμαντρα']];
  ROUTES.forEach(r => {
    const pts = [];
    for (let i = 0; i < r.length-1; i++) { const a = ctr(r[i]), b = ctr(r[i+1]); if (!a || !b) continue;
      for (let s = 0; s <= 24; s++) { const f = s/24, bend = Math.sin(f*Math.PI) * .012 * (i % 2 ? 1 : -1);
        pts.push([a.lat + (b.lat-a.lat)*f + bend*(b.lng-a.lng), a.lng + (b.lng-a.lng)*f - bend*(b.lat-a.lat)]); } }
    L.polyline(pts, {pane:'roads', color:css('--fk-case'), weight:9, opacity:1, interactive:false}).addTo(map);
    L.polyline(pts, {pane:'roads', color:css('--fk-road'), weight:5.5, opacity:1, interactive:false}).addTo(map);
  });
  TOWNS.forEach(tw => { const b = townBox(tw); if (!b) return;
    L.marker([b.getNorth(), b.getCenter().lng], {interactive:false, icon:L.divIcon({className:'townlbl', html:`<span>${tw.name}</span>`, iconSize:[0,0]})}).addTo(map); });
}

// ---------- bottom sheet ----------
const panel = document.getElementById('panel'), scrim = document.getElementById('scrim');
let lastFocus = null;
const I = {
  dl:'<svg class="ic" viewBox="0 0 24 24"><rect class="d" x="4" y="15" width="16" height="5" rx="1.5"/><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  map:'<svg class="ic" viewBox="0 0 24 24"><path class="d" d="M9 4l6 2.5V20l-6-2.5z"/><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>',
  nav:'<svg class="ic" viewBox="0 0 24 24"><path class="d" d="M12 3 20 20l-8-4-8 4z"/><path d="M12 3 20 20l-8-4-8 4z"/></svg>',
  link:'<svg class="ic" viewBox="0 0 24 24"><rect class="d" x="8" y="8" width="12" height="12" rx="2"/><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  req:'<svg class="ic" viewBox="0 0 24 24"><rect class="d" x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M5 6v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/><path d="M9 13l2 2 4-4"/></svg>'
};
function openSheet(html){
  lastFocus = document.activeElement;
  panel.innerHTML = '<div class="grab"></div>' + html;
  panel.hidden = false; scrim.hidden = false;
  const x = document.getElementById('closeP'); x.onclick = close; x.focus();
}
function open(n){
  const t = T[n]; if (!t) return;
  sel = n; restyle();
  if (t.layer) t.layer.bringToFront();
  const navUrl = t.lp ? `https://www.google.com/maps/dir/?api=1&destination=${t.lp[0].toFixed(6)},${t.lp[1].toFixed(6)}` : null;
  openSheet(`<div class="ph"><span class="badge" style="--tc:${t.fill};--ti:${t.ink}">${t.n}</span>
      <div><b id="pTitle">Τομέας ${t.n}</b><span class="sub">${t.town}${t.hood ? ' · ' + t.hood : ''}</span>
      ${t.holder ? `<span class="holder">Τον έχει: ${t.holder}</span>` : ''}</div>
      <button class="x" id="closeP" aria-label="Κλείσιμο">×</button></div>
    <div class="acts">
      ${t.mid ? `<a class="btn" href="https://www.google.com/maps/d/viewer?mid=${t.mid}" target="_blank" rel="noopener">${I.map}Google Maps</a>` : ''}
      ${navUrl ? `<a class="btn" href="${navUrl}" target="_blank" rel="noopener">${I.nav}Οδηγίες</a>` : ''}
      ${view === 'board' && t.ll ? `<button class="btn wide" id="onMap">${I.map}Στον χάρτη</button>` : ''}
    </div>
    ${t.ll ? '' : '<p class="reqnote">Ο χάρτης αυτού του τομέα δεν έχει προστεθεί ακόμη.</p>'}`);
  const om = document.getElementById('onMap');
  if (om) om.onclick = () => { close(); view = 'map'; goTo(n); };
  try { history.replaceState(null, '', '#t' + n); } catch (e) {}
}
function openTown(tw){
  sel = null; restyle();
  openSheet(`<div class="ph"><div><b id="pTitle">${tw.name}</b><span class="sub">Οι χάρτες των τομέων θα προστεθούν σύντομα</span></div>
    <button class="x" id="closeP" aria-label="Κλείσιμο">×</button></div>
    <div class="soonlist">${tw.ns.map(n => `<a href="#t${n}" data-open="${n}">${n}</a>`).join('')}</div>`);
  panel.querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); open(+a.dataset.open); });
}
function close(){
  panel.hidden = true; scrim.hidden = true; sel = null; restyle();
  try { history.replaceState(null, '', page === 'choria' ? '#choria' : '#polygyros'); } catch (e) {}
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
scrim.onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) close(); });

// "Οι τομείς μου": pick your name, your territories light up
function people(){
  const byKey = {};
  Object.values(T).forEach(t => { if (t.hk) (byKey[t.hk] = byKey[t.hk] || {key:t.hk, name:t.holder, ns:[]}).ns.push(t.n); });
  return Object.values(byKey).sort((a,b) => a.name.localeCompare(b.name, 'el') || a.ns[0] - b.ns[0]);
}
function setMe(name, jump){
  me = name;
  try { name ? localStorage.setItem('tb-me', name) : localStorage.removeItem('tb-me'); } catch (e) {}
  if (!panel.hidden) close();
  const ns = me ? mineOf(me) : [];
  const bar = document.getElementById('minebar');
  if (me && ns.length) {
    bar.innerHTML = `<span>${nameOf(me)}</span><div class="ns">${ns.map(n => `<button data-go="${n}">${n}</button>`).join('')}</div><button class="off" aria-label="Απενεργοποίηση">×</button>`;
    bar.hidden = false;
    bar.querySelectorAll('[data-go]').forEach(b => b.onclick = () => goTo(+b.dataset.go));
    bar.querySelector('.off').onclick = () => setMe(null);
    if (jump) {
      const inPoly = ns.filter(n => T[n].tw.poly), inVil = ns.filter(n => !T[n].tw.poly);
      const here = page === 'polygyros' ? (inPoly.length ? inPoly : inVil) : (inVil.length ? inVil : inPoly);
      show(here === inPoly ? 'polygyros' : 'choria', true);
      if (view === 'map') fitList(here, 60);
    }
  } else { bar.hidden = true; if (me) toast('Δεν έχεις τομέα αυτή τη στιγμή'); }
  restyle();
}

let toastTimer;
function toast(msg){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.querySelector('.stage').append(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2600);
}
// ---------- where am I ----------
let watch = null, meDot = null;
document.getElementById('locate').onclick = function(){
  if (watch !== null) { navigator.geolocation.clearWatch(watch); watch = null; meDot && meDot.remove(); meDot = null; this.setAttribute('aria-pressed','false'); return; }
  if (!navigator.geolocation) { toast('Η τοποθεσία δεν είναι διαθέσιμη'); return; }
  this.setAttribute('aria-pressed','true'); let first = true;
  watch = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (!meDot) meDot = L.circleMarker(ll, {radius:8, color:'#FFFFFF', weight:3, fillColor:'#4A82D6', fillOpacity:1}).addTo(map); else meDot.setLatLng(ll);
    if (first) { map.setView(ll, Math.max(map.getZoom(), 17)); first = false; }
  }, () => { toast('Η τοποθεσία δεν είναι διαθέσιμη εδώ'); this.setAttribute('aria-pressed','false'); watch = null; }, {enableHighAccuracy:true});
};

// ---------- search & start ----------
document.getElementById('reqTop').href = REQUEST_URL;
document.getElementById('mineBtn').href = REQUEST_URL + '#mine';
document.getElementById('find').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('findNum'), n = +inp.value;
  if (!T[n]) { inp.value = ''; inp.placeholder = '1–69'; return; }
  inp.blur(); goTo(n);
});
document.querySelectorAll('.seg a').forEach(a => a.addEventListener('click', () => { if (!panel.hidden) close(); }));
const hint = document.getElementById('hint');
setTimeout(() => hint.style.opacity = '0', 8000);
map.on('click', () => hint.style.opacity = '0');

window.addEventListener('hashchange', route);
route();
if (me) setMe(me, false);

// ---------- live data from the sheet ----------
// Code.gs (?view=board) replies {ok, territories:[{n, mid, holder, hk, polygons:[[[lat,lng],…],…]}]}.
// Borders built into this page are the fallback; the sheet's borders replace them when they arrive.
const ringArea = r => { let a = 0; for (let i = 0, j = r.length-1; i < r.length; j = i++) a += (r[j][1]+r[i][1]) * (r[j][0]-r[i][0]); return Math.abs(a); };
/* αν το Code.gs δεν ξέρει ακόμα το ?view=board, φτιάχνουμε τα ίδια στοιχεία από την κανονική απάντηση */
function normalize(data){
  if (!data || !Array.isArray(data.territories) || !data.territories.length || data.territories[0].n !== undefined) return data;
  const maps = (data.boundaries && data.boundaries.maps) || {}, open = {};
  (data.assignments || []).forEach(a => { if (a.territory_id && !a.date_in) open[a.territory_id] = a.person; });
  const ini = nm => String(nm || '').replace(/\./g, ' ').trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0).toUpperCase() + '.').join(' ');
  return {ok:true, territories: data.territories.filter(t => String(t.active).toUpperCase() !== 'FALSE').map(t => ({
    n: parseInt(String(t.id).replace(/\D/g, ''), 10), mid: t.mymaps_id || '', holder: open[t.id] ? ini(open[t.id]) : null, hk: open[t.id] || null,
    polygons: maps[t.id] && maps[t.id].polygons ? maps[t.id].polygons.map(p => p.coords) : [] }))};
}
function applyLive(data){
  data = normalize(data);
  if (!data || !Array.isArray(data.territories)) return false;
  let shapesChanged = false;
  const holders = {};
  data.territories.forEach(r => {
    const t = T[r.n]; if (!t) return;
    if (r.holder) holders[r.n] = {name:r.holder, key:r.hk || r.holder};
    if (r.mid) t.mid = r.mid;
    const rings = (r.polygons || []).filter(p => Array.isArray(p) && p.length > 2);
    if (rings.length) {
      const ll = rings.reduce((a, b) => ringArea(b) > ringArea(a) ? b : a).map(p => [Number(p[0]), Number(p[1])]).filter(p => isFinite(p[0]) && isFinite(p[1]));
      if (ll.length > 2 && JSON.stringify(ll) !== JSON.stringify(t.ll)) { t.ll = ll; t.lp = labelPoint(ll); shapesChanged = true; }
    }
  });
  setHolders(holders);
  if (shapesChanged) {
    TOWNS.forEach(tw => tw.mapped = tw.ns.every(n => T[n].ll));
    buildLayers(); placeLabels();
    if (view === 'board') renderBoard(page === 'polygyros'); else renderChips();
  }
  if (me) setMe(me, false); else restyle();
  return true;
}
function afterShapes(){
  loadRoads().then(r => { if (!r.length) return; ROADS = r; drawMapRoads(); if (view === 'board') renderBoard(page === 'polygyros'); });
}
if (!API_URL) afterShapes();
if (API_URL) {
  try { applyLive(JSON.parse(localStorage.getItem('tb-live') || 'null')); } catch (e) {}   // last good copy, shown instantly
  fetch(API_URL + '?view=board').then(r => r.json()).then(data => {
    if (applyLive(data)) { try { localStorage.setItem('tb-live', JSON.stringify(normalize(data))); } catch (e) {} }
    afterShapes();
  }).catch(() => { toast('Δεν φορτώθηκαν τα νέα δεδομένα· εμφανίζονται τα τελευταία'); afterShapes(); });
}
