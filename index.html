<style>
:root{
  --ground:#151A20; --sheet:#1D242C; --raised:#262F39;
  --rule:#313C48; --rule-soft:#252E37;
  --text:#E4EBF2; --muted:#93A3B3; --faint:#6B7A88;
  --accent:#6FD3C0; --accent-ink:#0F1A18; --accent-dim:#3E8C7E; --accent-wash:rgba(111,211,192,.10);
  --amber:#EBB37A; --coral:#E88C76; --blue:#7FA6E8; --slate:#5A6875;
  --n1:#27544E; --n2:#336F66; --n3:#43907F; --n4:#5FBCA8; --n5:#9DECDA;
  --idle:#7E8D9B;
  --map-bg:#10151A;
  --duo:#6FD3C0; --duo-op:.45; --logo-tile:#1D242C; --logo-acc:#6FD3C0; --logo-ink:#E4EBF2;
  --tilefx:grayscale(1) invert(1) brightness(.62) contrast(.62);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --ground:#F2F5F4; --sheet:#FFFFFF; --raised:#EAEFEE;
  --rule:#D2D9D7; --rule-soft:#E5EAE9;
  --text:#151C22; --muted:#57646F; --faint:#84919D;
  --accent:#127966; --accent-ink:#FFFFFF; --accent-dim:#9BD3C7; --accent-wash:rgba(18,121,102,.08);
  --amber:#A96A21; --coral:#BC4C33; --blue:#3665BE; --slate:#8A97A2;
  --n1:#D3E9E3; --n2:#A4D6C8; --n3:#69B8A3; --n4:#2F8B76; --n5:#0B5B4D;
  --idle:#9BA7AE;
  --map-bg:#F6F7F7;
  --duo:#6FD3C0; --duo-op:.6; --logo-tile:#FFFFFF; --logo-acc:#127966; --logo-ink:#151C22;
  --tilefx:grayscale(1) brightness(1.16) contrast(.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ground);color:var(--text);
  font:15px/1.5 'Geologica',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  box-shadow:0 0 0 1px var(--rule-soft)}
header{flex:0 0 auto;padding:calc(14px + var(--safe-t)) 8px 10px 14px;border-bottom:1px solid var(--rule-soft);
  display:flex;justify-content:space-between;align-items:center;gap:6px}
header .ico{--icobg:var(--ground)}
.sub{color:var(--faint);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub:not(:empty)::before{content:" · "}
.hbtns{display:flex;gap:0;flex:0 0 auto}
.hbtns button{width:31px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--text);border-radius:9px}
.hbtns button:active{background:var(--raised)}
.hbtns .ico{width:19px;height:19px}
.hbtns .spin-on svg{animation:sp .8s linear infinite}
.hbtns button{position:relative}
/* Κουμπί αιτήσεων: μόνο εικονίδιο, με αριθμό νέων στη γωνία */
#bellDot{position:absolute;top:2px;right:0;display:none;min-width:15px;height:15px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:9px;font-weight:700;line-height:15px;
  text-align:center;padding:0 3px;pointer-events:none}
#bellDot.on{display:inline-block}
.req{background:var(--raised);border:1px solid var(--rule-soft);border-radius:12px;
  padding:12px 14px;margin-bottom:10px}
.req.new{border-color:var(--accent-dim)}
.req .w{font-size:14.5px;font-weight:600}
.req .m{font-size:12px;color:var(--faint);margin-top:3px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
/* μικρή ένδειξη έκδοσης στο τέλος κάθε σελίδας */
main::after{content:attr(data-ver);display:block;text-align:center;font-size:10px;letter-spacing:.06em;
  color:var(--faint);opacity:.75;padding:22px 0 2px;grid-column:1/-1}
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--rule-soft);background:var(--sheet);padding-bottom:var(--safe-b)}
nav button{flex:1;padding:9px 4px 12px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}

.search{display:flex;align-items:center;gap:9px;background:var(--sheet);border:1px solid var(--rule-soft);
  border-radius:10px;padding:0 12px;margin-bottom:9px}
.search input{flex:1;background:none;border:0;padding:10px 0;color:var(--text);font:inherit;min-width:0}
.search input::placeholder{color:var(--faint)}
.search span,.search button{color:var(--faint);font-size:14px}
.search .ico{width:18px;height:18px;color:var(--text)}

/* συμπαγής εναλλαγή */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--raised);
  border:1px solid var(--rule);border-radius:8px;padding:2px;margin-bottom:10px}
.seg button{padding:6px 2px;border-radius:6px;font-size:11px;color:var(--muted);line-height:1.3}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sums{display:flex;gap:8px;margin-bottom:12px}
.sum{flex:1;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:block;margin-top:2px}

.row{display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule-soft);
  border-radius:12px;padding:9px 11px 9px 9px;margin-bottom:8px;width:100%;text-align:left}
.row .thumb{width:52px;height:44px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--map-bg)}
.row .thumb svg{display:block;width:100%;height:100%}
.row .info{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.row .dt{font-size:11.5px;color:var(--faint);margin-top:2px}
.row .val{text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.row .val em{display:block;font-style:normal;font-size:9px;letter-spacing:.06em;color:var(--faint);white-space:nowrap;
  font-weight:400;margin-top:1px;text-transform:uppercase}
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;padding:4px 8px;border-radius:99px;
  white-space:nowrap;text-transform:uppercase;flex:0 0 auto}
.pill.ok{color:var(--accent);background:var(--accent-wash);border:1px solid var(--accent-dim)}
.pill.due{color:var(--amber);background:rgba(235,179,122,.14);border:1px solid rgba(235,179,122,.4)}
.pill.late{color:var(--coral);background:rgba(232,140,118,.14);border:1px solid rgba(232,140,118,.45)}
.pill.out{color:var(--blue);background:rgba(127,166,232,.14);border:1px solid rgba(127,166,232,.4)}
.pill.rest{color:var(--muted);background:var(--raised);border:1px solid var(--rule)}

/* ομάδα ατόμου */
.pgroup{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:13px;
  margin-bottom:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:11px;padding:11px 12px;width:100%;text-align:left;
  border-bottom:1px solid var(--rule-soft)}
.phead .av{width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent-wash);border:1px solid var(--accent-dim);color:var(--accent);
  font-size:13px;font-weight:700}
.phead .info{flex:1;min-width:0;display:block}
.phead .info>span{display:block}
.phead .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.phead .dt{font-size:11px;color:var(--faint);margin-top:2px}
.phead .count{flex:0 0 auto;min-width:34px;height:34px;padding:0 9px;border-radius:10px;
  background:var(--raised);border:1px solid var(--rule);color:var(--text);
  font-size:15px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.plist{padding:4px 8px 8px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 0;width:100%;text-align:left;position:relative}
.pitem+.pitem{border-top:1px solid var(--rule-soft)}
.pstem{width:20px;flex:0 0 auto;align-self:stretch;position:relative}
.pstem::before{content:"";position:absolute;left:9px;top:-9px;bottom:50%;border-left:1.5px solid var(--rule)}
.pstem::after{content:"";position:absolute;left:9px;top:50%;width:9px;border-top:1.5px solid var(--rule)}
.pitem:last-child .pstem::before{bottom:50%}
.pitem .thumb{width:44px;height:38px;border-radius:7px;overflow:hidden;flex:0 0 auto;background:var(--map-bg)}
.pitem .thumb svg{display:block;width:100%;height:100%}
.pitem .info{flex:1;min-width:0;display:block}
.pitem .info>span{display:block}
.pitem .nm{font-size:13.5px;font-weight:600}
.pitem .dt{font-size:11px;color:var(--faint);margin-top:1px}

/* πλακίδια περιοχών */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;overflow:hidden;text-align:left;padding:0}
.tile .mini{height:96px;background:var(--map-bg)}
.tile .ft{padding:8px 9px 9px}
.tile .tn{font-size:13px;font-weight:600;letter-spacing:-.01em}
.tile .tc{font-size:10px;color:var(--faint);margin-top:2px}
.bars{display:flex;gap:2px;margin-top:7px}
.bars i{flex:1;height:4px;border-radius:2px}
.mini svg{display:block;width:100%;height:100%}
.mmw{position:relative;overflow:hidden;background:var(--map-bg)}
.mmt{position:absolute;inset:0;filter:var(--tilefx)}
.mmt img{position:absolute;width:256px;height:256px;max-width:none}
.mmw svg{position:absolute;inset:0;width:100%;height:100%}

.legend{margin-top:18px;padding:14px;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px}
.legend h4{margin:0 0 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.lramp{display:flex;gap:3px}
.lramp i{flex:1;height:18px;border-radius:3px}
.lramplab{display:flex;gap:3px;margin-top:5px}
.lramplab span{flex:1;text-align:center;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:14px}
.lgrid div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.lgrid i{width:14px;height:9px;border-radius:2px;flex:0 0 auto}

.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--rule-soft);
  margin-bottom:12px;background:var(--map-bg)}
.mapbox .lf{height:230px}
.mapbox.big .lf{height:310px}
.expand{position:absolute;right:8px;bottom:8px;z-index:500;background:var(--sheet);
  border:1px solid var(--rule);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.leaflet-tile-pane{filter:var(--tilefx)}
.leaflet-container{background:var(--map-bg);font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(128,128,128,.16)!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:9px!important;overflow:hidden;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5)!important}
.leaflet-control-zoom a{background:var(--sheet)!important;color:var(--text)!important;
  border-color:var(--rule)!important}
.leaflet-control-zoom a:hover{background:var(--raised)!important}
.leaflet-control-zoom-in{border-bottom:1px solid var(--rule)!important}
#full{position:fixed;inset:0;z-index:1000;background:var(--ground);display:none;flex-direction:column}
#full.on{display:flex}
#full .bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--rule-soft)}
#full .bar b{font-size:15px;font-weight:600}
#full .bar span{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
#full .lf{flex:1}
.maplbl{background:var(--sheet);border:1px solid var(--rule);color:var(--text);border-radius:7px;
  box-shadow:none;font-weight:600;font-size:12px;padding:3px 8px}
.maplbl::before{display:none}

.btns{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;text-align:center;padding:13px 6px;border-radius:10px;font-size:14.5px;font-weight:600;
  background:var(--raised);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;gap:8px}
.btn .ico{width:19px;height:19px}
.btn.pri{font-weight:700}
.btn.pri .ico .d,.btn.pri .ico .d1{fill:currentColor;fill-opacity:.18}
.btn.pri .ico .bg{fill:var(--accent)}
/* ενέργειες τομέα, έξω από αναδυόμενο παράθυρο */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 14px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 9px;border-radius:10px;
  background:var(--sheet);border:1px solid var(--rule);font-size:11.5px;font-weight:600;line-height:1.2;text-align:center}
.acts .ico{width:22px;height:22px}
.acts button:active{background:var(--raised)}
.acts button:disabled{opacity:.4}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 0 12px}
.dhead .stat{display:inline-flex;align-items:center;gap:6px;margin-top:9px}
.dhead .stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hrow .ico{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-left:6px;color:var(--muted)}
/* αιτήσεις */
.card h2.ht{display:flex;align-items:center;gap:9px}
.card h2.ht .ico{width:22px;height:22px}
.rbtns{display:flex;gap:8px;margin-top:10px}
.rbtns .btn{padding:10px 6px;font-size:13.5px;background:var(--sheet)}
.req.ri{display:flex;align-items:center;gap:10px}
.req.ri>div{flex:1;min-width:0}
.seenb{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:9px;border:1px solid var(--rule);
  background:var(--sheet);font-size:12px;font-weight:600;flex:0 0 auto}
.seenb .ico{width:16px;height:16px}
.seen{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--faint)}
.seen .ico{width:15px;height:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--coral);border-color:rgba(232,140,118,.45)}
.btn:disabled{opacity:.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px}
.kv b{font-weight:600;text-align:right}
h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:22px 0 8px;font-weight:600}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);
  color:var(--muted);font-size:13px}
.hist div:last-child{border-bottom:0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:9px 0;border-bottom:1px solid var(--rule-soft);color:var(--muted);font-size:13px;text-align:left}
.hrow:last-of-type{border-bottom:0}
.hrow b{color:var(--text);font-weight:600}
.hrow i{font-style:normal;color:var(--faint);margin-left:5px}
.hist b{color:var(--text);font-weight:600}
.empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:14px}

.scrim{position:fixed;inset:0;background:rgba(8,11,14,.62);display:flex;align-items:flex-end;z-index:1100}
.card{background:var(--sheet);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;width:100%;
  padding:10px 16px calc(18px + var(--safe-b));max-height:88vh;max-height:88svh;overflow-y:auto;
  overscroll-behavior:contain;touch-action:pan-y}
.grab{display:block;width:36px;height:4px;border-radius:99px;background:var(--rule);margin:2px auto 14px;
  touch-action:none}
.card h2{margin:0 0 4px;font-size:17px;font-weight:700}
.card .cs{font-size:12px;color:var(--faint);margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid var(--rule-soft);
  border-radius:11px;background:var(--raised);width:100%;text-align:left}
.opt b{display:block;font-size:14.5px;font-weight:600}
.opt small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.opt .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--sheet);border:1px solid var(--rule);color:var(--text)}
.opt .ic .ico{width:20px;height:20px}
label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:12px 0 5px}
input,select{width:100%;background:var(--raised);border:1px solid var(--rule);border-radius:9px;
  padding:11px 12px;color:var(--text);font:inherit;font-size:16px;min-width:0}
input[type="date"]{padding:9px 6px 9px 10px}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.check input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + var(--safe-b));background:var(--raised);
  border:1px solid var(--accent-dim);border-radius:11px;padding:12px 14px;display:none;z-index:1200;
  align-items:center;gap:12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
#toast.on{display:flex}
#toast span{flex:1;font-size:13.5px}
#toast button{color:var(--accent);font-weight:700;font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--rule);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- εικονίδια δύο χρωμάτων ---- */
.ico{width:20px;height:20px;display:block;flex:0 0 auto;--icobg:var(--sheet)}
.ico .d{fill:var(--duo);fill-opacity:var(--duo-op)}
.ico .d1{fill:var(--duo)}
.ico .bg{fill:var(--icobg)}
.ico .ns{stroke:none}
.ico .mb{fill:var(--icobg)}
.ico .mp{fill:none}
/* ---- λογότυπο ---- */
.logo{width:30px;height:30px;border-radius:7px;box-shadow:0 0 0 1px var(--rule-soft);flex:0 0 auto;display:block}
.logo .lt{fill:var(--logo-tile)}
.logo .li{fill:none;stroke:var(--logo-ink)}
.logo .la{fill:var(--logo-acc);stroke:var(--logo-acc)}
.logo .lq{fill:var(--logo-acc);fill-opacity:.3;stroke:var(--logo-ink)}
.logo .lb{fill:var(--logo-acc);stroke:var(--logo-tile)}
.logo .lh{fill:var(--logo-tile)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand .bt{min-width:0}
.brand .app{font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
/* ---- κάτω καρτέλες με εικονίδια ---- */
nav button{display:flex;flex-direction:column;align-items:center;gap:4px}
nav .ico{width:22px;height:22px;--icobg:var(--sheet)}
nav button:not(.on) .ico .d,nav button:not(.on) .ico .d1{fill:none}
nav button.on .ico{color:var(--text)}
nav button.on .ico .mb{fill:var(--duo);stroke:var(--sheet);stroke-width:1.6}
nav button.on .ico .mp{fill:var(--sheet);stroke:none}
/* ---- κουμπί «πίσω» ---- */
.back{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;margin:0 0 12px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:99px;color:var(--text);
  font-size:13px;font-weight:600;line-height:1.2}
.back .ico{width:22px;height:22px}
.back:active{background:var(--raised)}
/* ---- νέος τομέας / αλλαγή τομέα ---- */
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search{flex:1}
.addsq{flex:0 0 auto;width:44px;margin-bottom:9px;border-radius:10px;border:1px solid var(--rule-soft);background:var(--sheet);
  color:var(--faint);display:grid;place-items:center}
.addsq .ico{width:20px;height:20px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.trow .addsq{height:38px;width:40px}
.stepper{display:flex;gap:6px;margin:4px 0 6px}
.stepper span{flex:1;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--faint);
  padding-top:7px;border-top:3px solid var(--rule)}
.stepper span.on{color:var(--accent);border-top-color:var(--accent)}
.stepper span.done{color:var(--muted);border-top-color:var(--accent-dim)}
.hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.4}
.two{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.fake{width:100%;background:var(--raised);border:1px solid var(--rule);border-radius:9px;padding:11px 12px;font-size:16px;color:var(--muted)}
.mstep{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.mstep .k{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:var(--accent-wash);border:1px solid var(--accent-dim);color:var(--accent)}
.mstep b{display:block;font-size:14px;font-weight:600}
.mstep small{display:block;font-size:12px;color:var(--faint);margin-top:2px;line-height:1.4}
.mstep+input{margin-top:2px}
.mini-btn{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:8px 12px;border-radius:9px;
  border:1px solid var(--rule);background:var(--raised);font-size:13px;font-weight:600}
.mini-btn .ico{width:17px;height:17px}
.preview{border:1px solid var(--accent-dim);border-radius:12px;overflow:hidden;margin-top:12px;background:var(--sheet)}
.preview svg.pv{display:block;width:100%;height:150px;background:var(--map-bg)}
.preview .pf{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:13px}
.preview .pf .ico{width:20px;height:20px;color:var(--accent)}
.preview .pf small{display:block;color:var(--faint);font-size:11.5px}
.shape{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--rule-soft);
  border-radius:11px;background:var(--raised);margin-bottom:8px}
.shape.on{border-color:var(--accent)}
.shape svg{width:46px;height:40px;border-radius:7px;background:var(--map-bg);flex:0 0 auto}
.shape .nm{flex:1;min-width:0}
.shape .nm b{display:block;font-size:13.5px;font-weight:600}
.shape .nm small{display:block;font-size:11px;color:var(--faint)}
.shape .shnum{width:72px;text-align:center;font-weight:700;padding:8px 6px}
.cb{width:20px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);
  font-size:13px;font-weight:800;flex:0 0 auto}
.tfmsg{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.45}
.tfmsg.bad{color:var(--coral)}
.tfmsg .ico{width:19px;height:19px;flex:0 0 auto}
.btn.warn .ico{color:var(--coral)}
/* σημειώσεις ετών στο παράθυρο εκτύπωσης */
.ystats{border:1px solid var(--rule-soft);border-radius:11px;overflow:hidden;margin:4px 0 4px}
.ystats button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px}
.ystats button:last-child{border-bottom:0}
.ystats button.on{background:var(--accent-wash)}
.ystats b{font-weight:700;white-space:nowrap}
.ystats span{color:var(--muted);text-align:right}
.ystats em{font-style:normal;color:var(--coral);font-weight:600}
.ystats i{font-style:normal;color:var(--faint);font-size:11px;margin-left:4px}
.vlog{margin-top:8px;font-size:12.5px}
.vlog summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.vlog div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-soft);color:var(--muted);line-height:1.4}
.vlog b{flex:0 0 38px;color:var(--text)}
/* ειδοποιήσεις */
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.02em;color:var(--text)}
.nlist{margin:6px 0 10px;padding-left:20px;font-size:12.5px;color:var(--muted);line-height:1.55}
.nlist a{color:var(--accent)}
/* ===== Υπολογιστής / tablet: πλαϊνή πλοήγηση, περισσότερος χώρος ===== */
@media (min-width:900px){
  #app{max-width:1280px;display:grid;grid-template-columns:220px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);grid-template-areas:"h h" "n m";box-shadow:none}
  #app.nonav{grid-template-columns:minmax(0,1fr);grid-template-areas:"h" "m"}
  header{grid-area:h;padding:16px 24px 12px}
  nav{grid-area:n;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;
    border-top:0;border-right:1px solid var(--rule-soft);background:transparent}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;
    padding:11px 14px;border-radius:10px;font-size:11.5px;text-align:left}
  nav button.on{box-shadow:none;background:var(--accent-wash)}
  nav button:not(.on):hover{background:var(--raised);color:var(--text)}
  main{grid-area:m;padding:22px 32px 48px}
  /* λίστες σε δύο στήλες */
  /* grid-auto-rows:max-content: κάθε σειρά παίρνει το πλήρες ύψος του περιεχομένου της —
     αλλιώς, σε σελίδα με κύλιση, οι κάρτες με πολλούς τομείς συμπιέζονται και επικαλύπτονται */
  main.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;
    column-gap:14px;align-content:start;align-items:start}
  main.cols>*{grid-column:1/-1}
  /* σελίδα ενός τομέα: κεντρική στήλη */
  main.narrow{padding-left:max(32px,calc((100% - 820px)/2));padding-right:max(32px,calc((100% - 820px)/2))}
  .mapbox .lf{height:360px}
  .scrim{align-items:center;justify-content:center;padding:24px}
  .grab{display:none}
  #toast{left:50%;right:auto;width:440px;margin-left:-220px;bottom:28px}
  button:not(:disabled):hover{filter:brightness(1.06)}
}
@media (min-width:900px){
  main.cols>.row,main.cols>.pgroup{grid-column:auto}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tile .mini{height:150px}
  .mapbox.big .lf{height:400px}
  .card{max-width:540px;border:1px solid var(--rule);border-radius:16px;max-height:86vh}
  .sums{max-width:640px}
}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm 8mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  /* τυπώνεται ΜΟΝΟ το έντυπο — όχι absolute, ώστε να σπάει σωστά σε σελίδες */
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static;width:100%;color:#000;background:#fff;
    font:10pt/1.3 "Helvetica Neue",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* κάθε σελίδα είναι ξεχωριστός πίνακας με σταθερό αριθμό τομέων:
     κανένας τομέας δεν κόβεται στη μέση όταν αλλάζει η σελίδα */
  .rpage{break-after:page;page-break-after:always}
  .rpage:last-child{break-after:auto;page-break-after:auto}
  .rhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 3mm}
  .rhead h1{font-size:12.5pt;font-weight:700;letter-spacing:.08em;margin:0}

<script>
var APP_VERSION='4.2', SCRIPT_NEEDS='3.1';
/* ==================================================================
   Η ΜΟΝΗ ΓΡΑΜΜΗ ΠΟΥ ΙΣΩΣ ΧΡΕΙΑΣΤΕΙ ΝΑ ΑΛΛΑΞΕΙΣ
   ================================================================== */
var API = 'https://script.google.com/macros/s/AKfycbwRUO7Zf1Ngkx3HSNbu1DjIjPaAo2RWF8MSYGdJZIZeLDE3k5Nk_gogN6YNIiYw8ffi/exec';
/* ================================================================== */

/* ==================================================================
   ΠΗΓΗ ΧΑΡΤΗ
   Ο OpenStreetMap μπλοκάρει εφαρμογές που ζητούν πολλά πλακίδια από
   τους εθελοντικούς του διακομιστές, γι' αυτό πλέον χρησιμοποιούμε
   Esri (δωρεάν, χωρίς κλειδί) με εφεδρικό το CARTO. Αν χρειαστεί
   αλλαγή, αλλάζει μόνο αυτός ο πίνακας.
   ================================================================== */
var TILES=[
  {u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

   credit:'OpenStreetMap', max:19}
];
function tileUrl(i,z,x,y){
  return TILES[i].u.replace('{z}',z).replace('{x}',x).replace('{y}',y);
}
/* αν ένα πλακίδιο δεν φορτώσει, δοκιμάζει την επόμενη πηγή */
function tileFail(img){
  var i=(+img.getAttribute('data-src')||0)+1;
  if(i>=TILES.length){ img.style.visibility='hidden'; return; }
  img.setAttribute('data-src',i);
  img.src=tileUrl(i,img.getAttribute('data-z'),img.getAttribute('data-x'),img.getAttribute('data-y'));
}
var D={territories:[],assignments:[],people:[],settings:{},requests:[],geo:null};
var tab='map', filter='ready', pfilter='all', place='all', mapMode='free', q='',
    detail=null, person=null, town=null, undoTimer=null, lmaps={};

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ return new Date().toISOString().slice(0,10); }
function pd(s){ if(!s) return null; var p=String(s).slice(0,10).split('-');
  return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null; }
function fmt(d){ d=(typeof d==='string')?pd(d):d; if(!d) return '—';
  return d.toLocaleDateString('el-GR',{day:'2-digit',month:'short',year:'numeric'}); }
function addM(d,n){ var x=new Date(d.getTime()),day=x.getDate(); x.setMonth(x.getMonth()+n);
  if(x.getDate()<day) x.setDate(0); return x; }
function dys(a,b){ return Math.round((b-a)/86400000); }
function monthsSince(d,now){ var m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
  if(now.getDate()<d.getDate()) m--; return m+Math.max(0,dys(addM(d,m),now))/30; }
function dur(days){ days=Math.abs(Math.round(days));
  if(days<14) return {n:days,u:days===1?'ημέρα':'ημέρες'};
  if(days<60) return {n:Math.round(days/7),u:'εβδομάδες'};
  var m=days/30.44; return {n:(m<10?m.toFixed(1):Math.round(m)),u:'μήνες'}; }
function durTxt(d){ var x=dur(d); return x.n+' '+x.u; }
function monthsTxt(m){ if(m===Infinity) return 'ποτέ';
  if(m<1) return Math.round(m*30.44)+' ημέρες';
  if(m<2) return Math.round(m*30.44/7)+' εβδομάδες';
  return (m<10?m.toFixed(1):Math.round(m))+' μήνες'; }
function initials(n){ return String(n).split(/\s+/).filter(Boolean).slice(0,2)
  .map(function(w){ return w[0]; }).join('').toUpperCase(); }

/* ---------- κατάσταση ---------- */
function statusOf(t,now){
  var rows=(D._byVer===dataVer&&D._by)?(D._by[t.id]||[]).slice()
    :D.assignments.filter(function(a){ return a.territory_id===t.id; });
  rows.sort(function(a,b){ return String(a.date_out).localeCompare(String(b.date_out)); });
  var open=null; rows.forEach(function(r){ if(!r.date_in) open=r; });
  if(open){
    var out=pd(open.date_out), due=addM(out,D.settings.hold_months), left=dys(now,due);
    return {state:left<0?'overdue':(left<=D.settings.warn_days?'due':'out'),
      holder:open.person,rowId:open.row_id,dateOut:out,dueOn:due,
      daysLeft:left,daysHeld:dys(out,now),rows:rows};
  }
  var rets=rows.filter(function(r){return r.date_in;}).map(function(r){return r.date_in;}).sort();
  var last=rets.length?rets[rets.length-1]:(t.last_completed||'');
  if(!last) return {state:'ready',rested:Infinity,never:true,band:5,rows:rows};
  var ld=pd(last), r=monthsSince(ld,now);
  if(r<D.settings.rest_months) return {state:'resting',rested:r,lastReturned:ld,readyOn:addM(ld,D.settings.rest_months),rows:rows};
  return {state:'ready',rested:r,band:r<6?1:r<8?2:r<10?3:r<12?4:5,lastReturned:ld,rows:rows};
}
function isOut(s){ return ['out','due','overdue'].indexOf(s.state)>=0; }
function col(s){
  if(s.state==='overdue') return 'var(--coral)';
  if(s.state==='due') return 'var(--amber)';
  if(s.state==='out') return 'var(--blue)';
  if(s.state==='resting') return 'var(--slate)';
  return ['','var(--n1)','var(--n2)','var(--n3)','var(--n4)','var(--n5)'][s.band||1];
}
function colMode(s){
  if(mapMode==='free') return isOut(s)?'var(--idle)':col(s);
  if(mapMode==='work') return isOut(s)?col(s):'var(--idle)';
  return col(s);
}
function pill(s){
  if(s.state==='overdue') return '<span class="pill late">'+durTxt(s.daysLeft)+' πέρασαν</span>';
  if(s.state==='due') return '<span class="pill due">'+durTxt(s.daysLeft)+'</span>';
  if(s.state==='out') return '<span class="pill out">'+durTxt(s.daysLeft)+'</span>';
  if(s.state==='resting') return '<span class="pill rest">μη διαθέσιμο</span>';
  return '<span class="pill ok">διαθέσιμος</span>';
}
function statusTxt(s){
  if(s.state==='overdue') return 'Εκπρόθεσμο · '+durTxt(s.daysLeft)+' πέρασαν';
  if(s.state==='due') return 'Λήγει σε '+durTxt(s.daysLeft);
  if(s.state==='out') return 'Δοσμένος · απομένουν '+durTxt(s.daysLeft);
  if(s.state==='resting') return 'Μη διαθέσιμο';
  return 'Διαθέσιμος';
}
/* Περιοχές που μετρούν ως μία, όσο κοντά κι αν τις γράφει το φύλλο */
var TOWN_ALIAS={'Διασταύρωση Παλαιοκάστρου':'Παλαιόκαστρο','Διασταύρωση':'Παλαιόκαστρο'};
function townOf(t){ var n=String(t.town||'').trim(); return TOWN_ALIAS[n]||n; }
/* Οι καταστάσεις υπολογίζονται ΜΙΑ φορά ανά έκδοση δεδομένων (και ανά ημέρα),
   όχι σε κάθε κλήση — έτσι οι οθόνες ζωγραφίζονται αμέσως. */
var dataVer=0, _allMemo=null, _allKey='', _byId={};
function bump(){ dataVer++; }
function all(){ var now=new Date(), k=dataVer+'|'+now.toDateString();
  if(_allMemo&&_allKey===k) return _allMemo;
  var by={}; D.assignments.forEach(function(a){ (by[a.territory_id]=by[a.territory_id]||[]).push(a); });
  D._by=by; D._byVer=dataVer;
  _allMemo=D.territories.filter(function(t){ return String(t.active).toUpperCase()!=='FALSE'; })
    .map(function(t){ t.town=townOf(t); t.s=statusOf(t,now); return t; });
  _byId={}; _allMemo.forEach(function(t){ _byId[t.id]=t; });
  _allKey=k; return _allMemo; }
function byId(id){ all(); return _byId[id]; }
function inTown(n){ return all().filter(function(t){ return t.town===n; }); }
function match(t){ if(!q) return true;
  return (t.name+' '+t.town+' '+t.id+' '+(t.s.holder||'')).toLowerCase().indexOf(q.toLowerCase())>=0; }

/* ---------- γεωμετρία & πλακίδια χάρτη ---------- */
function geoOf(id){ return D.geo&&D.geo.maps?D.geo.maps[id]:null; }
function bboxOf(list){
  var b=null;
  list.forEach(function(t){ var g=geoOf(t.id); if(!g||!g.polygons) return;
    g.polygons.forEach(function(p){ p.coords.forEach(function(c){
      if(!b) b=[c[0],c[1],c[0],c[1]];
      else{ b[0]=Math.min(b[0],c[0]); b[1]=Math.min(b[1],c[1]);
            b[2]=Math.max(b[2],c[0]); b[3]=Math.max(b[3],c[1]); } }); }); });
  return b;
}
function wx(lng,z){ return (lng+180)/360*256*Math.pow(2,z); }
function wy(lat,z){ var r=lat*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z); }

/**
 * Μικρός χάρτης σε SVG: αληθινά πλακίδια OpenStreetMap στο φόντο
 * και από πάνω τα πολύγωνα. Χωρίς Leaflet — ελαφρύ για λίστες.
 */
function projOf(list,w,h,pad){
  var b=bboxOf(list); if(!b) return null;
  pad=pad==null?0.05:pad;
  var z=1;
  for(var zz=18;zz>=1;zz--){
    var pw=Math.abs(wx(b[3],zz)-wx(b[1],zz)), ph=Math.abs(wy(b[0],zz)-wy(b[2],zz));
    if(pw<=w*(1-2*pad) && ph<=h*(1-2*pad)){ z=zz; break; }
  }
  var x0=wx(b[1],z), x1=wx(b[3],z), y0=wy(b[2],z), y1=wy(b[0],z);
  return {z:z, ox:(w-(x1-x0))/2-x0, oy:(h-(y1-y0))/2-y0};
}
function polyPaths(list,p,highlight){
  var out='';
  list.forEach(function(t){
    var gg=geoOf(t.id); if(!gg||!gg.polygons) return;
    var hi=!highlight||t.id===highlight;
    var c=highlight?(t.id===highlight?col(t.s):'var(--idle)'):colMode(t.s);
    gg.polygons.forEach(function(pl){
      var d=pl.coords.map(function(cc,i){
        return (i?'L':'M')+(wx(cc[1],p.z)+p.ox).toFixed(1)+' '+(wy(cc[0],p.z)+p.oy).toFixed(1); }).join('')+'Z';
      out+='<path d="'+d+'" fill="'+c+'" fill-opacity="'+(hi?.55:.16)+'" stroke="'+c+'" '+
        'stroke-width="'+(hi?1.5:1)+'" stroke-linejoin="round"/>';
    });
  });
  return out;
}
/** Μικρογραφία χωρίς πλακίδια — μόνο τα σχήματα. Ελαφριά, για λίστες. */
function miniSvg(list,w,h,highlight){
  var p=projOf(list,w,h);

  return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+

function tileSpan(p,w,h){
  return {x0:Math.floor((0-p.ox)/256), x1:Math.floor((w-p.ox)/256),

/**
 * Μικρός χάρτης ΜΕ πλακίδια: κανονικές <img> μέσα σε div, όπως και το
 * Leaflet — έτσι δουλεύει το CSS filter παντού (και στο Safari).
 * Κρατάμε το πολύ 4 πλακίδια ανά μικρογραφία: ο διακομιστής χαρτών
 * μπλοκάρει εφαρμογές που ζητούν δεκάδες πλακίδια μαζί.
 */
function miniTiles(list,w,h,highlight){
  var p=projOf(list,w,h);
  if(!p) return '<div class="mmw" style="width:'+w+'px;height:'+h+'px"></div>';
  /* Ο αριθμός πλακιδίων εξαρτάται από το ΜΕΓΕΘΟΣ του πλαισίου, όχι από το ζουμ —
     γι' αυτό δεν κάνουμε ποτέ ζουμ-άουτ για να λιγοστέψουν. Αν χρειάζονται πολλά,
     κρατάμε όσα είναι πιο κοντά στο κέντρο (οι άκρες μένουν κενές, δεν πειράζει). */
  var MAX=8, n=Math.pow(2,p.z), sp=tileSpan(p,w,h), cands=[];
  for(var tx=sp.x0;tx<=sp.x1;tx++) for(var ty=sp.y0;ty<=sp.y1;ty++){
    if(ty<0||ty>=n) continue;
    var left=tx*256+p.ox, top=ty*256+p.oy;
    var dx=(left+128)-w/2, dy=(top+128)-h/2;
    cands.push({tx:tx,ty:ty,left:left,top:top,d:dx*dx+dy*dy});
  }
  cands.sort(function(a,b){ return a.d-b.d; });
  var imgs='';
  cands.slice(0,MAX).forEach(function(t){
    var xx=((t.tx%n)+n)%n;
    imgs+='<img alt="" data-src="0" data-z="'+p.z+'" data-x="'+xx+'" data-y="'+t.ty+'" '+
      'onerror="tileFail(this)" src="'+tileUrl(0,p.z,xx,t.ty)+'" '+
      'style="left:'+t.left.toFixed(1)+'px;top:'+t.top.toFixed(1)+'px">';
  });
  return '<div class="mmw" style="width:'+w+'px;height:'+h+'px">'+
    '<div class="mmt">'+imgs+'</div>'+
    '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+polyPaths(list,p,highlight)+'</svg></div>';
}

function osm(m){

      if(i+1>=TILES.length) return;

}
function drawLeaflet(elId,list,opts){

function refresh(then){

    .then(function(j){

function optimistic(b){
  var td=today();
  switch(b.action){
    case 'giveOut': D.assignments.push({row_id:'tmp-'+Date.now(),territory_id:b.territory,person:b.person,
      date_out:b.date||td,date_in:''}); return true;
    case 'takeBack': D.assignments.forEach(function(a){ if(a.territory_id===b.territory && !a.date_in) a.date_in=b.date||td; }); return true;
    case 'editRow': D.assignments.forEach(function(a){ if(String(a.row_id)===String(b.rowId)){
      a.person=b.person; a.date_out=b.dateOut; a.date_in=b.dateIn||''; } }); return true;
    case 'undo': D.assignments=D.assignments.filter(function(a){ return String(a.row_id)!==String(b.rowId); }); return true;
    case 'seenReq': (D.requests||[]).forEach(function(r){ if(!b.rowId||String(r.row_id)===String(b.rowId)) r.status='seen'; }); return true;
    case 'cancelReq': D.requests=(D.requests||[]).filter(function(r){ return String(r.row_id)!==String(b.rowId); }); return true;
    case 'savePerson': if(!D.people.some(function(p){ return p.name===b.name; })) D.people.push({name:b.name,active:'TRUE'}); return true;
    case 'saveSetting': D.settings[b.key]=isNaN(+b.value)||b.value===''?b.value:+b.value; return true;
    case 'saveTerritory':
      _codes=null;
      if(b.create){ D.territories.push({id:b.id,town:b.town,name:b.name,mymaps_id:b.mymaps_id||'',shape:b.shape||'',
        last_completed:b.last_completed||'',active:'TRUE',added:today()}); return true; }
      D.territories.forEach(function(t){ if(t.id!==b.id) return;
        ['town','name','mymaps_id','shape'].forEach(function(k){ if(b[k]!==undefined) t[k]=b[k]; });
        if(b.active!==undefined) t.active=b.active?'TRUE':'FALSE'; });

function post(body,done,raw){
  var st=0, changed=false;

  if(!raw){ try{ changed=optimistic(body); }catch(e){} if(changed){ bump(); render(); } }
  var undoLocal=function(){ if(changed){ lastFresh=0; refresh(); } };
  fetch(API,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){ st=r.status; return r.text(); })
    .then(function(txt){
      var j;
      try{ j=JSON.parse(txt); }
      catch(e){
        alert('Το Google απάντησε κάτι που δεν κατάλαβα (κωδικός '+st+').\n\n'+
              String(txt).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,180)+
              '\n\nΣυνήθως σημαίνει ότι το script χρειάζεται νέα ανάπτυξη (Deploy → New version).');
        undoLocal(); return;
      }
      /* παλιό script χωρίς batch: στέλνουμε τις ενέργειες μία-μία */
      if(!j.ok && body.action==='batch' && /batch/.test(String(j.error))){ runSeq(body.ops,done); return; }
      if(!j.ok){ alert('Σφάλμα: '+j.error); undoLocal(); return; }
      if(j.data) applyFresh(j.data);

}
function runSeq(ops,done){

/** Φορτώνει τα πλακίδια χάρτη (φόντο) μόνο για τα tiles που μπαίνουν στην οθόνη —
 * αλλιώς ένα τηλέφωνο ζητάει δεκάδες εικόνες ταυτόχρονα και όλα αργούν. */
function lazyTiles(towns){
  var els=document.querySelectorAll('.mini[data-mm]');
  if(!('IntersectionObserver' in window)){
    els.forEach(function(el){ var tn=towns[+el.getAttribute('data-mm')];
      if(tn) el.innerHTML=miniTiles(tn.list,el.clientWidth||150,el.clientHeight||96); });
    return;
  }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var el=en.target, tn=towns[+el.getAttribute('data-mm')];
      if(tn) el.innerHTML=miniTiles(tn.list,el.clientWidth||150,el.clientHeight||96);
      io.unobserve(el);
    });
  },{rootMargin:'250px 0px'});
  els.forEach(function(el){ io.observe(el); });
}

/* ================= ΜΙΑ ΠΕΡΙΟΧΗ (όλα τα δεδομένα) ================= */
function groupSections(list){
  var g={ready:[],resting:[],out:[]};
  list.forEach(function(t){ g[isOut(t.s)?'out':t.s.state].push(t); });
  g.ready.sort(function(a,b){ return (b.s.rested===Infinity?1e9:b.s.rested)-(a.s.rested===Infinity?1e9:a.s.rested); });
  g.resting.sort(function(a,b){ return a.s.readyOn-b.s.readyOn; });
  g.out.sort(function(a,b){ return a.s.daysLeft-b.s.daysLeft; });
  var h='';
  [['ready','Διαθέσιμοι'],['out','Δοσμένοι'],['resting','Μη διαθέσιμοι']].forEach(function(sec){
    if(!g[sec[0]].length) return;
    h+='<h3>'+sec[1]+' · '+g[sec[0]].length+'</h3>';
    g[sec[0]].forEach(function(t){ h+=rowFor(t,list); });
  });
  if(!list.length) h='<div class="empty">Κανένας τομέας.</div>';
  return h;
}

/* ================= ΤΟΜΕΙΣ ================= */
function valFor(t){
  var s=t.s;
  if(isOut(s)){ var d=dur(s.daysLeft);
    return '<div class="val" style="color:'+col(s)+'">'+d.n+
      '<em>'+d.u+' '+(s.daysLeft<0?'πέρασαν':'μένουν')+'</em></div>'; }
  if(s.state==='resting'){ var r=dur(dys(new Date(),s.readyOn));
    return '<div class="val" style="color:var(--slate)">'+r.n+'<em>'+r.u+' ως έτοιμος</em></div>'; }
  var m=s.rested;
  return '<div class="val" style="color:'+col(s)+'">'+(m===Infinity?'—':(m<10?m.toFixed(1):Math.round(m)))+'<em>μήνες</em></div>';
}
function rowFor(t,peers){

    '<div class="thumb">'+miniSvg(peers||inTown(t.town),52,44,t.id)+'</div>'+

/* ================= ΝΕΟΣ ΤΟΜΕΑΣ / ΑΛΛΑΓΗ ΤΟΜΕΑ =================
   Όλα από την εφαρμογή: αριθμός, περιοχή (και νέα), όνομα, σύνδεση με My Maps.
   Το σχέδιο γίνεται στο My Maps· εδώ επικολλάται ο σύνδεσμος και ελέγχεται αμέσως. */
function midOf(s){
  s=String(s||'').trim();
  var m=s.match(/[?&#]mid=([\w-]+)/); if(m) return m[1];
  return /^[\w-]{20,}$/.test(s)?s:'';
}
function tid(n){ n=parseInt(n,10); return 'T'+(n<10?'0':'')+n; }
function nextNum(after){
  var used={}, n=after||0;
  D.territories.forEach(function(t){ used[parseInt(String(t.id).replace(/\D/g,''),10)]=1; });
  if(!after) Object.keys(used).forEach(function(k){ if(+k>n) n=+k; });
  n++; while(used[n]) n++;
  return n;
}
function townNames(){
  var o={}; D.territories.forEach(function(t){ var n=townOf(t); if(n) o[n]=1; });
  return Object.keys(o).sort(function(a,b){ return a.localeCompare(b,'el'); });
}
/* σχήματα (λίστες [lat,lng]) σε μικρό SVG· hi = ποιο τονίζεται (-1 = όλα) */
function shapeSvg(polys,w,h,hi){
  var z=17, P=polys.map(function(p){ return p.map(function(c){ return [wx(c[1],z),wy(c[0],z)]; }); });
  var all_=[].concat.apply([],P);
  if(!all_.length) return '<svg viewBox="0 0 '+w+' '+h+'"></svg>';
  var xs=all_.map(function(p){ return p[0]; }), ys=all_.map(function(p){ return p[1]; });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var s=Math.min((w-16)/((x1-x0)||1),(h-16)/((y1-y0)||1)), ox=(w-(x1-x0)*s)/2, oy=(h-(y1-y0)*s)/2;
  var out='<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
  P.forEach(function(p,i){
    var on=hi<0||hi===i;
    out+='<path d="M'+p.map(function(q){ return ((q[0]-x0)*s+ox).toFixed(1)+' '+((q[1]-y0)*s+oy).toFixed(1); }).join(' L')+'Z" '+
      'fill="'+(on?'var(--duo)':'var(--idle)')+'" fill-opacity="'+(on?.32:.12)+'" stroke="'+(on?'var(--duo)':'var(--idle)')+
      '" stroke-width="'+(on?2:1)+'" stroke-linejoin="round"/>';
  });
  return out+'</svg>';
}
/* απλή κλήση στο script χωρίς ανανέωση δεδομένων (έλεγχος χάρτη) */
function apiCall(body){
  return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('Το Google δεν απάντησε σωστά. Δοκίμασε ξανά.'); }
      if(!j.ok){
        if(/Άγνωστη ενέργεια/.test(String(j.error))) throw new Error('Χρειάζεται νέα ανάπτυξη του Code.gs (Deploy → New version).');
        throw new Error(j.error||'σφάλμα');
      }
      return j;
    });
}

    var re=q('tRe'); if(re) re.onclick=function(){ d.remove(); toast('Ξαναδιάβασμα σχήματος…');
      post({action:'refreshMap',id:ed.id},function(j){ geoFrom(j); toast('Το σχήμα ανανεώθηκε'); }); };
    var rt=q('tRet'); if(rt) rt.onclick=function(){ d.remove(); var id=ed.id; detail=null;
      post({action:'saveTerritory',id:id,active:false},function(){});

/* ---------- σημειώσεις για κάθε υπηρεσιακό έτος (στο παράθυρο εκτύπωσης) ---------- */
function isoD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function yearStats(y){
  var r=svcYear(y), F=isoD(r.from), T=isoD(r.to);
  var list=D.territories.filter(function(t){ return String(t.active).toUpperCase()!=='FALSE' &&
    (!t.added || String(t.added).slice(0,10)<=T); });
  var done=list.filter(function(t){
    var lc=String(t.last_completed||'').slice(0,10);
    if(lc && lc>=F && lc<=T) return true;
    return (D._by&&D._by[t.id]||D.assignments.filter(function(a){ return a.territory_id===t.id; })).some(function(a){
      var i=String(a.date_in||'').slice(0,10); return i && i>=F && i<=T; });
  }).length;
  return {n:list.length, done:done, not:list.length-done};
}

var CARD_OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];

      .then(function(j){ return (j.elements||[]).filter(function(x){

var CARD_ROAD_STYLE={
  3:{casing:'#FFFFFF',cw:22,line:'#56626D',lw:12,font:'700 28px ',col:'#18212A'},

    });

/* κόβει μια γραμμή στο ορατό πλαίσιο (Liang–Barsky) → κομμάτια μέσα στο πλαίσιο */
function cardClip(pts,b){
  var out=[], cur=null;
  for(var i=0;i<pts.length-1;i++){
    var x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1],dx=x1-x0,dy=y1-y0,t0=0,t1=1,ok=true;
    [[-dx,x0-b[0]],[dx,b[2]-x0],[-dy,y0-b[1]],[dy,b[3]-y0]].forEach(function(pq){
      if(!ok) return; var p=pq[0],q=pq[1];
      if(p===0){ if(q<0) ok=false; return; }
      var r=q/p; if(p<0){ if(r>t1) ok=false; else if(r>t0) t0=r; } else { if(r<t0) ok=false; else if(r<t1) t1=r; }
    });
    if(!ok){ cur=null; continue; }
    var A=[x0+t0*dx,y0+t0*dy], B=[x0+t1*dx,y0+t1*dy];
    if(!cur||t0>0){ cur=[A]; out.push(cur); }
    cur.push(B);
    if(t1<1) cur=null;
  }
  return out;
}
/* ονόματα δρόμων πάνω στα ευθύγραμμα κομμάτια, χωρίς να πέφτουν το ένα πάνω στο άλλο */
function cardLabels(c,ways,P,box,taken,F){
  var cands=[];
  ways.forEach(function(w){
    var nm=String((w.tags||{}).name||'').trim(); if(!nm) return;
    var r=CARD_RANK[w.tags.highway], full=w.geometry.map(function(g){ return P(g.lat,g.lon); });
    cardClip(full,[box[0]+12,box[1]+12,box[2]-12,box[3]-12]).forEach(function(pts){
    var i=0;
    while(i<pts.length-1){
      var j=i+1, a0=Math.atan2(pts[j][1]-pts[i][1],pts[j][0]-pts[i][0]), len=0;
      len+=Math.hypot(pts[j][0]-pts[i][0],pts[j][1]-pts[i][1]);
      while(j<pts.length-1){
        var a1=Math.atan2(pts[j+1][1]-pts[j][1],pts[j+1][0]-pts[j][0]), d=Math.abs(a1-a0);
        if(d>Math.PI) d=2*Math.PI-d;
        if(d>0.35) break;
        len+=Math.hypot(pts[j+1][0]-pts[j][0],pts[j+1][1]-pts[j][1]); j++;
      }
      var A=pts[i], B=pts[j], ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
      if(ang>Math.PI/2) ang-=Math.PI; if(ang<-Math.PI/2) ang+=Math.PI;
      cands.push({nm:nm,r:r,len:len,A:A,B:B,ang:ang});
      i=j;
    }
    });
  });
  cands.sort(function(a,b){ return (b.r-a.r)||(b.len-a.len); });
  var placed=taken.slice(), named={}, n=0;
  /* μεγάλα ονόματα συντομεύονται όπως στους χάρτες */
  var shortNm=function(x){ return x.replace(/^Εθνική Οδός\s*/,'Ε.Ο. ').replace(/^Επαρχιακή Οδός\s*/,'Επ.Ο. ')
    .replace(/^Λεωφόρος\s*/,'Λεωφ. ').replace(/^Οδός\s+/,''); };
  cands.forEach(function(k){

    };
    var names=[]; D.territories.forEach(function(t){ var n=townOf(t);
      if(n && names.indexOf(n)<0) names.push(n); });
    _codes={};
    var full={}; names.forEach(function(n){ full[n]=strip(n); });
    names.forEach(function(n){
      var w=full[n], c=w.slice(0,3);
      var clash=names.filter(function(m){ return m!==n && full[m].slice(0,3)===c; });
      if(clash.length){                         /* ΠΑΛΚ / ΠΑΛΧ αντί για ΠΑΛ / ΠΑΛΑ */
        var i=3;
        while(i<w.length && clash.some(function(m){ return full[m][i]===w[i]; })) i++;
        c=c+(w[i]||String(names.indexOf(n)+1));
      }
      _codes[n]=c;
    });
  }
  return _codes[name]||'';
}
function buildReport(y){
  var r=svcYear(y), from=r.from, to=r.to;
  var iso=function(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); };
  var F=iso(from), T=iso(to), SLOTS=4;
  var dsh=function(v){ return v?fmt(pd(v)):''; };

  var list=D.territories.filter(function(t){ return String(t.active).toUpperCase()!=='FALSE'; })
    .slice().sort(function(a,b){
      var na=parseInt(String(a.id).replace(/\D/g,''),10), nb=parseInt(String(b.id).replace(/\D/g,''),10);
      return (na||0)-(nb||0); });

  /* iPhone/iPad τυπώνουν διαφορετικά από τον υπολογιστή — δύο εκδοχές του ίδιου εντύπου */
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var rowsHtml=list.map(function(t){
    var rows=D.assignments.filter(function(a){ return a.territory_id===t.id; })
      .sort(function(a,b){ return String(a.date_out).localeCompare(String(b.date_out)); });
    /* μέσα στο υπηρεσιακό έτος: ό,τι δόθηκε ή επεστράφη μέσα στο διάστημα */
    var inY=rows.filter(function(a){
      var o=String(a.date_out||'').slice(0,10), i=String(a.date_in||'').slice(0,10);
      return (o&&o>=F&&o<=T) || (i&&i>=F&&i<=T) || (o&&o<F&&!i);
    });
    /* τελευταία ολοκλήρωση πριν αρχίσει το έτος */
    var before=rows.filter(function(a){ var i=String(a.date_in||'').slice(0,10); return i&&i<F; })
      .map(function(a){ return a.date_in; }).sort();
    var lastc=before.length?before[before.length-1]:(t.last_completed||'');

    var who='', dts='';
    for(var k=0;k<SLOTS;k++){
      var a=inY[k];
      if(ios){
        who+='<td class="who se" colspan="2">'+(a?esc(a.person):'')+'</td>';
        dts+='<td class="dt">'+(a?dsh(a.date_out):'')+'</td><td class="dt se">'+(a?dsh(a.date_in):'')+'</td>';
      } else {
        who+='<td class="who sl" colspan="2">'+(a?esc(a.person):'')+'</td>';
        dts+='<td class="dt sl">'+(a?dsh(a.date_out):'')+'</td><td class="dt">'+(a?dsh(a.date_in):'')+'</td>';
      }
    }
    var num=String(t.id).replace(/^T0?/,''), code=townCode(townOf(t));
    if(!ios) return '<tbody><tr style="height:7.5mm"><td class="num" rowspan="2">'+esc(num)+'<small>'+esc(code)+'</small></td>'+
      '<td class="lastc" rowspan="2">'+dsh(lastc)+'</td>'+who+'</tr>'+
      '<tr style="height:5.5mm">'+dts+'</tr></tbody>';
    return '<tbody><tr><td class="num" rowspan="2">'+esc(num)+'<small>'+esc(code)+'</small></td>'+
      '<td class="lastc se" rowspan="2">'+dsh(lastc)+'</td>'+who+'</tr>'+
      '<tr>'+dts+'</tr></tbody>';
  });

  var cols='<colgroup><col style="width:10mm"><col style="width:'+(ios?18:19)+'mm">';
  for(var c=0;c<SLOTS*2;c++) cols+='<col>';
  cols+='</colgroup>';
  var A=ios?'':' class="sl"', B=ios?' class="se"':'';
  var head='<tr><th rowspan="2">Αρ.<br>Τομ.</th>'+
    '<th rowspan="2"'+B+'>Τελευταία<br>ημερομηνία<br>ολοκλήρωσης</th>';
  for(var j=0;j<SLOTS;j++) head+='<th colspan="2" class="'+(ios?'se':'sl')+'">Ανατέθηκε στον/στη(ν)</th>';
  head+='</tr><tr>';
  for(var j2=0;j2<SLOTS;j2++) head+='<th'+A+'>Ημερομηνία<br>ανάθεσης</th><th'+B+'>Ημερομηνία<br>ολοκλήρωσης</th>';
  head+='</tr>';

  /* ίσος αριθμός τομέων ανά σελίδα (έως 18) — έτσι δεν κόβεται ποτέ τομέας */
  var PER=18, pages=Math.max(1,Math.ceil(rowsHtml.length/PER)), per=Math.ceil(rowsHtml.length/pages);
  var out='';
  for(var p=0;p<pages;p++){
    out+='<div class="rpage"><div class="rhead"><h1>ΕΝΤΥΠΟ ΔΙΟΡΙΣΜΟΥ ΤΟΜΕΑ</h1>'+
      '<div class="ryear">Υπηρεσιακό Έτος:<span class="box">'+r.label+'</span>'+
      (pages>1?'<span class="rpg">'+(p+1)+'/'+pages+'</span>':'')+'</div></div>'+
      '<table class="rtab">'+cols+'<thead>'+head+'</thead>'+
      rowsHtml.slice(p*per,(p+1)*per).join('')+'</table></div>';
  }
  var pa=document.getElementById('printArea');
  pa.className=ios?'ios':'pc'; pa.innerHTML=out;
  setTimeout(function(){ window.print(); },80);
}

     :'<div class="btns"><button class="btn pri" id="nOn">'+ic('bell')+'Ενεργοποίηση στο κινητό</button></div>')+

function wireNotify(d){
  var q=function(id){ return d.querySelector('#'+id); };
  var save=function(pairs,msg,reopen){
    postMany(pairs.map(function(p){ return {action:'saveSetting',key:p[0],value:p[1]}; }),function(){
      toast(msg); if(reopen){ d.remove(); openSettings(); setTimeout(function(){
        var c=document.querySelector('.scrim .card'); if(c) c.scrollTop=c.scrollHeight; },60); } });
  };
  var on=q('nOn'); if(on) on.onclick=function(){
    var a='abcdefghjkmnpqrstuvwxyz23456789', c='th-';
    for(var i=0;i<14;i++) c+=a[Math.floor(Math.random()*a.length)];
    save([['notify_ntfy',c],['app_url',appUrl()]],'Ειδοποιήσεις ενεργές — ακολούθησε τα 3 βήματα',true); };
  var cp=q('nC'); if(cp) cp.onclick=function(){ copy(String(D.settings.notify_ntfy)); toast('Ο κωδικός αντιγράφηκε'); };
  var te=q('nT'); if(te) te.onclick=function(){ toast('Αποστολή δοκιμής…');
    apiCall({action:'testNotify'}).then(function(j){ toast(j.sent?'Στάλθηκε — έλεγξε το κινητό':'Δεν στάλθηκε'); })
      .catch(function(e){ toast(e.message); }); };
  var off=q('nOff'); if(off) off.onclick=function(){ save([['notify_ntfy','']],'Οι ειδοποιήσεις σταμάτησαν',true); };
  var es=q('nES'); if(es) es.onclick=function(){ var v=q('nE').value.trim();
    if(v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast('Το email δεν φαίνεται σωστό'); return; }
    save([['notify_email',v],['app_url',appUrl()]],v?'Θα έρχεται και email':'Χωρίς email',false); };
  [].forEach.call(d.querySelectorAll('[data-restore]'),function(b){ b.onclick=function(){
    var id=b.getAttribute('data-restore'); b.disabled=true;
    post({action:'saveTerritory',id:id,active:true},function(){ toast('Ο τομέας επανήλθε'); }); }; });
}

function retiredHtml(){
  var r=D.territories.filter(function(t){ return String(t.active).toUpperCase()==='FALSE'; });
  if(!r.length) return '';
  return '<h3>Αποσυρμένοι τομείς</h3>'+r.map(function(t){
    return '<div class="kv"><span style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--text)">'+esc(t.name||t.id)+'</span>'+
      '<b><button class="lnk" style="color:var(--accent);font-weight:600" data-restore="'+esc(t.id)+'">Επαναφορά</button></b></div>'; }).join('');
}
function openSettings(){
  var withMap=D.territories.filter(function(t){ return t.mymaps_id; }).length, ok=0, bad=[];
  if(D.geo) D.territories.forEach(function(t){ if(!t.mymaps_id) return;
    var g=geoOf(t.id); if(g&&g.polygons&&g.polygons.length) ok++; else bad.push(t.id); });
  var d=modal('<h2>Ρυθμίσεις</h2><div class="cs">Αποθηκεύονται στο φύλλο</div>'+
    '<label>Μήνες κράτησης</label><input type="number" id="sH" value="'+D.settings.hold_months+'" min="1" max="24">'+
    '<label>Μήνες μη διαθεσιμότητας</label><input type="number" id="sR" value="'+D.settings.rest_months+'" min="0" max="24">'+
    '<label>Προειδοποίηση (ημέρες πριν)</label><input type="number" id="sW" value="'+D.settings.warn_days+'" min="0" max="90">'+
    '<div class="btns" style="margin-top:16px"><button class="btn pri" id="sS">Αποθήκευση</button></div>'+
    '<h3>Χάρτες</h3><div class="kv"><span>Φορτώθηκαν</span><b'+(bad.length?' style="color:var(--coral)"':'')+'>'+
      (D.geo?ok+' από '+withMap:'—')+'</b></div>'+
    (bad.length?'<div class="kv"><span>Πρόβλημα</span><b style="color:var(--coral)">'+bad.join(', ')+'</b></div>':'')+
    '<div class="kv"><span>Ηλικία ορίων</span><b>'+(isFinite(geoAge())?durTxt(geoAge()/86400000):'—')+'</b></div>'+

      ((+localStorage.getItem('tomeis_geo_ms')||0)?Math.round(localStorage.getItem('tomeis_geo_ms')/1000)+' δευτ.':'—')+'</b></div>'+
    '<p style="margin:8px 0 10px;font-size:12.5px;color:var(--faint);line-height:1.5">'+
      'Η «Ανανέωση χαρτών» ξαναδιαβάζει τα όρια από το Google My Maps. Χρειάζεται μόνο '+
      'όταν σχεδιάσεις νέο τομέα ή αλλάξεις ένα σχήμα — αλλιώς τα όρια κρατιούνται '+
      'αποθηκευμένα για 6 ώρες για να ανοίγει γρήγορα η εφαρμογή.</p>'+
    '<div class="btns" style="margin-top:2px"><button class="btn" id="sM">Ανανέωση χαρτών</button></div>'+

    '<div class="kv"><span>Script (Code.gs)</span><b'+(verNum(D.scriptVersion)<verNum(SCRIPT_NEEDS)?' style="color:var(--coral)"':'')+'>'+
      (D.scriptVersion?'v'+D.scriptVersion:'παλιά έκδοση')+'</b></div>'+
    (verNum(D.scriptVersion)<verNum(SCRIPT_NEEDS)?'<p class="hint" style="margin:6px 0 0">Χρειάζεται Code.gs v'+SCRIPT_NEEDS+' — '+
      'επικόλλησε το νέο και κάνε Deploy → Manage deployments → New version.</p>':'')+
    '<details class="vlog"><summary>Ιστορικό εκδόσεων</summary>'+VLOG.map(function(v){
      return '<div><b>v'+v[0]+'</b><span>'+v[1]+'</span></div>'; }).join('')+'</details>'+
    notifyHtml()+retiredHtml());
  wireNotify(d);
  d.querySelector('#sS').onclick=function(){
    var v=[['hold_months',d.querySelector('#sH').value],['rest_months',d.querySelector('#sR').value],
           ['warn_days',d.querySelector('#sW').value]]; d.remove();
    postMany(v.map(function(x){ return {action:'saveSetting',key:x[0],value:x[1]}; }),function(){
      refresh(); toast('Αποθηκεύτηκε'); }); };
  d.querySelector('#sM').onclick=function(){ d.remove();
    toast('Ανανέωση χαρτών… μπορεί να πάρει ένα λεπτό');
    post({action:'refreshMaps'},function(){
      fetchGeo(function(){
        var miss=D.territories.filter(function(t){ if(!t.mymaps_id) return false;
          var x=geoOf(t.id); return !(x&&x.polygons&&x.polygons.length); });
        toast(miss.length?('Ανανεώθηκαν — δεν φόρτωσαν: '+miss.map(function(t){return t.id;}).join(', '))
                         :'Οι χάρτες ανανεώθηκαν');
      });
    }); };
}
